<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTel GenAI 语义约定 · 可视化</title>
<style>
:root{
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* 深色主题（默认） */
:root,html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121318;
  --panel:#191a21;
  --panel-2:#1f2028;
  --row-hover:#22242e;
  --line:#2a2c36;
  --line-2:#353845;
  --fg:#e3e4e9;
  --fg-2:#a8abb6;
  --fg-3:#8f939d;
  --accent:#6ea8dc;
  --accent-dim:#2f4a63;
  --warn:#d4ad2c;
  --warn-dim:#4d4118;
  --req:#d18b8b;
  --cond:#d4b273;
  --rec:#8db2cc;
  --opt:#848793;
  --ok:#7cb08c;
  --scope:rgba(255,255,255,.28);
  --err:#e0645c;
  --mcp:#5fb3a8;
  --prov:#c98fd6;
}
/* 浅色主题 */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;
  --panel:#f7f8fa;
  --panel-2:#eef0f4;
  --row-hover:#eceef3;
  --line:#e0e3e9;
  --line-2:#c9cdd6;
  --fg:#1b1d23;
  --fg-2:#4e525c;
  --fg-3:#636873;
  --accent:#2f6fb0;
  --accent-dim:#d6e6f5;
  --warn:#8a6a12;
  --warn-dim:#f5eccd;
  --req:#a8443f;
  --cond:#8a6a12;
  --rec:#2f6fb0;
  --opt:#6d727d;
  --ok:#2f7d4f;
  --scope:rgba(0,0,0,.32);
  --err:#c0392b;
  --mcp:#2f8b80;
  --prov:#8a4fa0;
}
*{box-sizing:border-box}
html{margin:0;padding:0;scrollbar-gutter:stable}
body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* ---------- 头部 ---------- */
header{border-bottom:1px solid var(--line);background:var(--panel)}
.hd{max-width:1560px;margin:0 auto;padding:20px 26px 0}
.hd-top{display:flex;align-items:flex-start;gap:14px 20px;flex-wrap:wrap}
.hd-top h1{flex:1 1 auto;min-width:260px}
.meta{min-width:0}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
h1 .sub{color:var(--fg-3);font-weight:400;font-size:13px;margin-left:8px}
.meta{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--fg-3);text-align:right;line-height:1.8;overflow-wrap:anywhere}
.meta b{color:var(--fg-2);font-weight:400}
.dek{margin:12px 0 0;max-width:96ch;color:var(--fg-2);font-size:13.5px}
.dek strong{color:var(--fg);font-weight:600}

/* ---------- Tab ---------- */
nav{max-width:1560px;margin:0 auto;padding:0 26px;display:flex;gap:2px}
nav button{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--fg-3);font-family:inherit;font-size:13.5px;padding:13px 15px 11px;
  cursor:pointer;transition:color .12s,border-color .12s;
}
nav button:hover{color:var(--fg-2)}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
nav button .n{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-left:6px}
nav button.on .n{color:var(--accent)}

main{max-width:1560px;margin:0 auto;padding:24px 26px 80px}
section{display:none}
section.on{display:block}

/* ---------- 通用块 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13.5px;font-weight:600}
.card-h .tag{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.card-b{padding:14px 16px}
.hint{color:var(--fg-3);font-size:12.5px;line-height:1.7}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

/* 注记条：两侧竖线，非圆角卡片 */
.note{border-left:2px solid var(--line-2);padding:2px 0 2px 14px;color:var(--fg-2);font-size:13px}
.note.warn{border-left-color:var(--warn)}
.note.warn .lbl{color:var(--warn)}
.note.err{border-left-color:var(--err)}
.note.err .lbl{color:var(--err)}
.note.err code{color:var(--err)}
.note .lbl{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--fg-3);text-transform:uppercase;margin-bottom:3px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-weight:500;color:var(--fg-3);font-size:11.5px;letter-spacing:.3px;
  text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
.k{font-family:var(--mono);font-size:12.5px;color:var(--fg)}
.ty{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.desc{color:var(--fg-2);font-size:12.5px}

/* 必填程度徽标 */
.rq{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:1px 5px;border:1px solid;border-radius:2px}
.rq.required{color:var(--req);border-color:var(--req)}
.rq.conditional{color:var(--cond);border-color:var(--cond)}
.rq.recommended{color:var(--rec);border-color:var(--rec)}
.rq.optin,.rq.other{color:var(--opt);border-color:var(--opt)}
.rq.inherit{color:var(--fg-3);border-color:var(--line-2)}

/* ---------- Tab1 概览 ---------- */
.stat-row{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.stat{flex:1 1 170px;min-width:0;padding:13px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-size:24px;font-family:var(--mono);color:var(--fg);line-height:1.2}
.stat .l{font-size:12px;color:var(--fg-3);margin-top:3px}
.stat .d{font-size:11.5px;color:var(--fg-3);font-family:var(--mono);margin-top:2px;overflow-wrap:anywhere}

.layer{border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden}
.layer-h{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;align-items:baseline;gap:9px}
.layer-h .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.layer-h b{font-size:13px;font-weight:600}
.layer-h span{font-size:12px;color:var(--fg-3)}
.sp-item{display:flex;align-items:baseline;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sp-item:last-child{border-bottom:0}
.sp-item:hover{background:var(--panel-2)}
.sp-item .nm{font-family:var(--mono);font-size:12.5px}
.sp-item .ct{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--fg-3);white-space:nowrap}

/* ---------- Trace 页工具条（观测后台风格，解释文字走 title 悬停） ---------- */
.opbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:4px 4px 0 0;padding:9px 14px}
.opbar-l{display:flex;align-items:baseline;gap:10px;min-width:0}
.op-t{font-size:14.5px;font-weight:600;color:var(--fg);cursor:help;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.flag{font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:2px;border:1px solid;white-space:nowrap;cursor:help}
.flag.ok{color:var(--ok);border-color:var(--ok)}
.flag.fake{color:var(--warn);border-color:var(--warn)}
.opbar-r{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.opbar-r .m{display:flex;align-items:baseline;gap:6px;cursor:help}
.opbar-r .m .k{font-size:10.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.4px}
.opbar-r .m .v{font-family:var(--mono);font-size:14px;color:var(--fg)}
.opbar-r .m.bad .v{color:var(--err)}
.opmeta{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:baseline;
  background:var(--panel-2);border:1px solid var(--line);border-top:0;
  border-radius:0 0 4px 4px;padding:7px 14px;font-size:11.5px;color:var(--fg-2);
  margin-bottom:4px}
.opmeta .src{font-family:var(--mono);color:var(--fg-3)}
.opmeta .kv{font-family:var(--mono);cursor:help}
.opmeta .kv i{font-style:normal;color:var(--fg-3);margin-right:5px}
.opmeta .kv.warn{color:var(--warn);border:1px solid var(--warn);border-radius:2px;padding:0 5px}

/* ---------- 规范对照说明（详情面板折叠区） ---------- */
.vs-note{font-size:12px;color:var(--fg-2);margin-top:8px;line-height:1.65;
  padding-left:9px;border-left:1px solid var(--line-2)}

/* ---------- Tab2 瀑布图 ---------- */
.trace-groups{margin-bottom:14px;display:grid;gap:7px}
.trace-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.trace-bar .lab{font-size:11.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.4px}
.tbtn{
  appearance:none;background:var(--panel);border:1px solid var(--line-2);color:var(--fg-2);
  font-family:inherit;font-size:12.5px;padding:5px 11px;border-radius:3px;cursor:pointer;
}
.tbtn:hover{border-color:var(--fg-3);color:var(--fg)}
.tbtn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media(max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none}
  .panel-b{overflow:visible}
}
/* 深 trace 用横向滚动而不是压缩：观测后台的通行做法 */
/* min-width:0 是关键：否则子元素的 min-width 会把 grid 列撑破整页 */
.wf-scroll{overflow-x:auto;overflow-y:hidden;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.wf-scroll::-webkit-scrollbar{height:9px}
.wf-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
.wf-scroll::-webkit-scrollbar-track{background:transparent}
#waterfall{display:block;height:auto;width:100%}
#waterfall text{font-family:var(--mono);font-size:13px;fill:var(--fg-2)}
#waterfall .lbl{fill:var(--fg)}
#waterfall .own{fill:var(--fg-3);font-size:11.5px}
#waterfall .grid{stroke:var(--line);stroke-width:1}
#waterfall .zone{stroke:var(--line-2);stroke-dasharray:3 3}
#waterfall .row:hover{fill:var(--row-hover)}
#waterfall .hit{cursor:pointer}
.legendrow{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3);margin-top:10px}
.legendrow i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:5px;vertical-align:-1px}

/* 详情面板 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;position:sticky;top:16px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.panel-h{padding:13px 15px;border-bottom:1px solid var(--line)}
.panel-h .t{font-family:var(--mono);font-size:13px;color:var(--fg);word-break:break-all}
.panel-h .m{font-size:11.5px;color:var(--fg-3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.panel-h .m span{white-space:nowrap}
.panel-b{overflow:auto;padding:0 15px 16px}
.panel-empty{padding:26px 15px;color:var(--fg-3);font-size:12.5px;text-align:center}
.grp{margin-top:14px}
.grp-h{display:flex;align-items:baseline;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:6px}
.grp-h b{font-size:12px;font-weight:600}
.grp-h .c{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.at{padding:6px 0;border-bottom:1px solid var(--line)}
.at:last-child{border-bottom:0}
.at-top{display:flex;align-items:baseline;gap:7px}
.at .k{flex:1;min-width:0;overflow-wrap:anywhere}
.at .mark{font-family:var(--mono);font-size:11px;flex:0 0 auto}
.at .mark.y{color:var(--ok)}
.at .mark.n{color:var(--fg-3)}
.at .val{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:3px;overflow-wrap:anywhere;word-break:break-word}
.at .no{font-size:11.5px;color:var(--fg-3);margin-top:3px;font-style:normal}
.at .why{font-size:11.5px;color:var(--fg-2);margin-top:3px;padding-left:9px;border-left:1px solid var(--line-2)}
.at .desc{font-size:11.5px;color:var(--fg-2);margin-top:3px}
.vals{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-top:2px}
.vals.scope{color:var(--accent);font-weight:600}

/* ---------- 详情面板：属性表为主，说明折叠 ---------- */
.attr-head{display:flex;align-items:center;gap:10px;padding:10px 0 7px;position:sticky;top:0;
  background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.attr-head>span{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.attr-search{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:3px;outline:none}
.attr-search:focus{border-color:var(--accent)}
.attr-list{padding-top:2px}
.aline{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;
  padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.aline:last-child{border-bottom:0}
.aline .ak{font-family:var(--mono);font-size:12px;color:var(--fg-3);overflow-wrap:anywhere}
.aline .av{font-family:var(--mono);font-size:12px;color:var(--fg);overflow-wrap:anywhere;cursor:default}
.aline .av.trunc{color:var(--fg-2);cursor:help}
.panel-info{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.panel-info>summary{cursor:pointer;font-size:12px;color:var(--fg-3);list-style:none;display:flex;align-items:center;gap:7px}
.panel-info>summary::-webkit-details-marker{display:none}
.panel-info>summary::before{content:"▸";font-size:10px;color:var(--fg-3)}
.panel-info[open]>summary::before{content:"▾"}
.panel-info>summary:hover{color:var(--fg-2)}
.info-body{padding-top:10px}
.err-line{margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--err);overflow-wrap:anywhere}

/* ---------- Tab3/4/5 列表 ---------- */
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){
  .split{grid-template-columns:minmax(0,1fr)}
  .slist{position:static;max-height:none}
}
.slist{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 40px);overflow-y:auto}
.slist .sh{padding:9px 13px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--fg-3);border-bottom:1px solid var(--line);background:var(--panel-2)}
/* 规范文档名与文件名是规范里的字面量，保持原样大小写，不被 CSS 改成大写 */
.slist .sh.doc{text-transform:none;letter-spacing:0;font-size:12px}
.slist .it{padding:8px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.slist .it:last-child{border-bottom:0}
.slist .it:hover{background:var(--panel-2)}
.slist .it.on{background:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
.slist .it .nm{font-family:var(--mono);font-size:12px;display:block;overflow-wrap:anywhere}
.slist .it .mt{font-size:11px;color:var(--fg-3);margin-top:2px}
.detail-h{margin-bottom:14px}
.detail-h .t{font-family:var(--mono);font-size:15px;word-break:break-all}
.detail-h .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11.5px}
.detail-h .tags span{font-family:var(--mono);color:var(--fg-3);border:1px solid var(--line-2);padding:1px 6px;border-radius:2px}
.detail-h .brief{color:var(--fg-2);font-size:13px;margin-top:10px;max-width:100ch}
.detail-h .note{color:var(--fg-2);font-size:12.5px;margin-top:8px;max-width:100ch}

/* metric 行 */
.mrow{display:grid;grid-template-columns:26px minmax(0,1fr) 110px 90px;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--panel-2)}
.mrow .nm{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.mrow .bd{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.mrow .nt{font-size:12px;color:var(--fg-3);margin-top:4px;padding-left:9px;border-left:1px solid var(--line-2)}
.mrow .u{font-family:var(--mono);font-size:11.5px;color:var(--fg-2)}
.mfig{margin-top:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 8px 2px}
.mshape{display:block;width:100%;max-width:560px;height:auto}
.mshape-t{font-family:var(--mono);font-size:11px;fill:var(--fg-2)}
.mshape-x{font-family:var(--mono);font-size:11px;fill:var(--fg-3)}
.mfig-note{margin-top:6px;font-size:12px;color:var(--fg-2);line-height:1.6}
.mfig-note .tag{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);border:1px solid var(--line-2);padding:0 4px;border-radius:2px}
.err{color:var(--warn)}
.sch{border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:var(--panel-2)}
.sch .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sch .k{font-family:var(--mono);font-size:12px;color:var(--fg)}
.sch .b{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
.sch .d{font-size:11.5px;color:var(--fg-2);margin-top:5px;line-height:1.6}
.sch .defs{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);margin-top:5px;overflow-wrap:anywhere}
.sch .src{font-family:var(--mono);font-size:10px;color:var(--fg-3);margin-top:5px;opacity:.8}
/* 宽表在窄屏横向滚动，不要撑破页面 */
.tbl-scroll{overflow-x:auto;margin-top:12px}
.tbl-scroll table{min-width:560px}
.tbl-scroll::-webkit-scrollbar{height:9px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
@media(max-width:640px){
  .mrow{grid-template-columns:22px minmax(0,1fr)}
  .mrow .u,.mrow .rq{grid-column:2}
  .stat{flex:1 1 46%}
  .mfig{padding:4px 6px 0}
}
footer{max-width:1560px;margin:0 auto;padding:0 26px 40px;color:var(--fg-3);font-size:12px}
footer hr{border:0;border-top:1px solid var(--line);margin:0 0 14px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-top">
      <h1>OpenTelemetry GenAI 语义约定<span class="sub">字段定义可视化</span></h1>
      <div class="meta" id="meta"></div>
      <button id="theme-btn" class="tbtn" type="button" title="切换浅色 / 深色主题（快捷键 t）">浅色</button>
    </div>
    <p class="dek">
      规范定义的是<strong>字段与口径</strong>：一个操作该发哪种信号、字段叫什么、值怎么算、由谁来发。
      下面的 trace 示例反映它最关键的一条约束——<strong>同一次 Agent 运行会被拆到多个库的插桩里</strong>，
      每个库只发自己拥有的操作。
    </p>
  </div>
  <nav id="tabs"></nav>

he system message or instructions provided to the GenAI model separately from the chat history.","note":"This attribute SHOULD be used when the corresponding provider or API allows to provide system instructions or messages separately from the chat history. Instructions that are part of the chat history SHOULD be recorded in `gen_ai.input.messages` attribute instead. Instrumentations MAY provide a way for users to filter or truncate system instructions. > [!Warning] > This attribute may contain sensitive information. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"系统提示，后端渲染对话时按 role 区分","stability":"development","briefZh":"与聊天历史分开提供给 GenAI 模型的系统消息或指令。","noteZh":"当对应的提供方或 API 允许将系统指令或消息与聊天历史分开提供时，宜使用该属性。属于聊天历史的指令宜记录在 gen_ai.input.messages 属性中。埋点库可以提供让用户过滤或截断系统指令的方式。注意：该属性可能包含敏感信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.input.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"user\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"Weather in Paris?\"\n      }\n    ]\n  },\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"name\": \"get_weather\",\n        \"arguments\": {\n          \"location\": \"Paris\"\n        }\n      }\n    ]\n  },\n  {\n    \"role\": \"tool\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call_response\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"response\": \"rainy, 57°F\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The chat history provided to the model as an input.\n","note":"Messages MUST be provided in the order they were sent to the model. Instrumentations MAY provide a way for users to filter or truncate input messages. > [!Warning] > T 能包含敏感信息，包括用户/个人身份信息。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.tool.definitions","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"type\": \"function\",\n    \"name\": \"get_current_weather\",\n    \"description\": \"Get the current weather in a given location\",\n    \"parameters\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"location\": {\n          \"type\": \"string\",\n          \"description\": \"The city and state, e.g. San Francisco, CA\"\n        },\n        \"unit\": {\n          \"type\": \"string\",\n          \"enum\": [\n            \"celsius\",\n            \"fahrenheit\"\n          ]\n        }\n      },\n      \"required\": [\n        \"location\",\n        \"unit\"\n      ]\n    }\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The list of tool definitions available to the GenAI agent or model.","note":"> [!WARNING] > This attribute may contain sensitive information. Since this attribute could be large, it's NOT RECOMMENDED to populate non-required properties by default. Instrumentations MAY provide a way to enable populating optional properties.","why":"","stability":"development","briefZh":"GenAI Agent 或模型可用的工具定义列表。","noteZh":"注意：该属性可能包含敏感信息。由于该属性可能很大，不建议默认填充非必需属性。埋点库可以提供开启可选属性填充的方式。","reqZh":"需显式开启","reqFrom":""},{"key":"error.type","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["timeout","java.net.UnknownHostException","server_certificate_invalid","500"],"req":"条件必填 · If the operation ended in an error.","reqCat":"conditional","brief":"Describes a class of error the operation ended with.","note":"The `error.type` SHOULD match the error code returned by the Generative AI provider or the client library, the canonical name of exception that occurred, or another low-cardinality error identifier. Instrumentations SHOULD document the list of errors they report.","why":"","stability":"s on; it MUST NOT be reported as `gen_ai.request.top_k`.","why":"","stability":"development","briefZh":"GenAI 请求的 top_k 采样设置：每步只从最可能的 K 个 token 中生成。","noteZh":"这是解码/采样参数（如 Anthropic 的 top_k、Cohere 的 k、Google 的 topK），而不是塑造输出的参数。特别地，OpenAI 的 top_logprobs 控制响应中返回多少个逐 token 对数概率，并不改变生成结果，因此不得将其报告为 gen_ai.request.top_k。","reqZh":"条件必填 · 若适用","reqFrom":""},{"key":"gen_ai.request.top_p","type":"double","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["1.0"],"req":"推荐","reqCat":"recommended","brief":"The top_p sampling setting for the GenAI request.","note":"","why":"采样参数","stability":"development","briefZh":"GenAI 请求的 top_p 采样设置。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.stop_sequences","type":"string[]","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["['forest', 'lived']"],"req":"推荐","reqCat":"recommended","brief":"List of sequences that the model will use to stop generating further tokens.","note":"","why":"停止序列","stability":"development","briefZh":"使模型停止继续生成 token 的序列列表。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.frequency_penalty","type":"double","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["0.1"],"req":"推荐","reqCat":"recommended","brief":"The frequency penalty setting for the GenAI request.","note":"","why":"采样参数","stability":"development","briefZh":"GenAI 请求的频率惩罚（frequency_penalty）设置。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.presence_penalty","type":"double","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["0.1"],"req":"推荐","reqCat":"recommended","brief":"The presence penalty setting for the GenAI request.","note":"","why":"采样参数","stability":"development","briefZh":"GenAI 请求的存在惩罚（presence_penalty）设置。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.seed","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"条件必填 · If applicable and if the request includes a seed.","reqCat":"conditional","brief":"Requests with same seed value more likely to return same result.","note":"","why":"固定种子可复现，仅厂商支持时才有","stability":"development","briefZh":"使用相同 seed 值的请求更可能返回相同结果。","noteZh":"","reqZh":"条件必填 · 若适用且该请求包含 seed","reqFrom":""},{"key":"gen_ai.output.type","type":"string","typeAlt":"enum","typeEnumCount":4,"values":["text","json","image","speech"],"valueBriefs":{"text":"Plain text","json":"JSON object with known or unknown schema","image":"Image","speech":"Speech"},"valueBriefsZh":{"text":"纯文本","json":"JSON 对象，schema 已知或未知","image":"图像","speech":"语音"},"examples":null,"req":"条件必填 · When applicable and if the request includes an output format.","reqCat":"conditional","brief":"Represents the content type requested by the client.","note":"This attribute SHOULD be used when the client requests output of a specific type. The model may return zero or more outputs of this type. This attribute specifies the output modality and not the actual output format. For example, if an image is requested, the actual output could be a URL pointing to an image file. Additional output format details may be recorded in the future in the `gen_ai.output.{type}.*` attributes.","why":"","stability":"development","briefZh":"客户端请求的内容类型（text / json / image / speech）。","noteZh":"当客户端请求特定类型的输出时，宜使用该属性。模型可以返回零个或多个该类型的输出。该属性指定的是输出模态，而不是实际的输出格式；例如请求图像时，实际输出可能是指向图像文件的 URL。未来可能在 gen_ai.output.{type}.* 属性中记录更多输出格式细节。","reqZh":"条件必填 · 若适用且该请求包含输出格式","reqFrom":""},{"key":"gen_ai.request.stream","type":"boolean","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":null,"req":"条件必填 · If and only if the request is streaming. If unset, the request is assumed to be non-streaming.","reqCat":"conditional","brief":"Indicates whether the GenAI request was made in streaming mode.","note":"","why":"仅流式请求才设；未设即视为非流式","stability": sponse.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["chatcmpl-123"],"req":"推荐","reqCat":"recommended","brief":"The unique identifier for the completion.","note":"","why":"与厂商侧日志对账的唯一凭据","stability":"development","briefZh":"本次补全的唯一标识符。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.response.model","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["gpt-4-0613"],"req":"推荐","reqCat":"recommended","brief":"The name of the model that generated the response.","note":"If available. The name of the GenAI model that provided the response. If the model is supplied by a vendor, then the value must be the exact name of the model actually used. If the model is a fine-tuned custom model, the value should have a more specific name than the base model that's been fine-tuned.","why":"实际响应模型，可能与请求不同（路由/降级/微调版）","stability":"development","briefZh":"生成该响应的模型名称。","noteZh":"若可得。给出该响应的 GenAI 模型名称。若模型由厂商提供，取值必须是实际所用模型的准确名称；若是微调的自定义模型，应使用比被微调的基础模型更具体的名称。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.response.finish_reasons","type":"string[]","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["['stop']","['stop', 'length']","['stop', 'length', 'error']"],"req":"推荐","reqCat":"recommended","brief":"Array of reasons the model stopped generating tokens, corresponding to each generation received.","note":"Values correspond to generations in the same order as the returned choices/candidates. Each position SHOULD contain the finish reason for the corresponding choice/candidate. If a finish reason was expected but not received, for example because generation failed, was cancelled, or a stream ended before the final event, instrumentations SHOULD report `error` for that position instead of omitting it. `error` indicates that the generation ended abnormally, whether reported by the provider or inferred by the instrumentation.","why":"stop / length / content_filter / tool_call / compaction / error，判断是否被截断","stability":"development","briefZh":"模型停止生成 token 的原因数组，与收到的各次生成一一对应。","noteZh":"各值按返回的选项/候选结果的相同顺序对应于各次生成。每个位置宜包含对应选项/候选结果的结束原因。若某个结束原因本应出现却未收到，例如生成失败、被取消，或流在最终事件之前结束，埋点库宜在该位置报告 error，而不是省略它。error 表示生成异常结束，无论该信息由提供方报告还是由埋点库推断。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.response.time_to_first_chunk","type":"double","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["0.5","1.2"],"req":"推荐 · If the request was a streaming request.","reqCat":"recommended","brief":"Time to first chunk in a streaming response, measured from request issuance, in seconds. The value is measured from when the client issues the generation request to when the first chunk is received in the response stream.\n","note":"","why":"流式首块延迟，用户体验的关键数字","stability":"development","briefZh":"流式响应的首块时间，从发起请求到收到响应流首个数据块，单位为秒。","noteZh":"","reqZh":"推荐 · 若该请求为流式请求","reqFrom":""},{"key":"gen_ai.usage.reasoning.output_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["50"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The number of output tokens used for reasoning (e.g. chain-of-thought, extended thinking).","note":"The value SHOULD be included in `gen_ai.usage.output_tokens`.","why":"推理模型用于思考的 token，单独拆出才能算清单价","stability":"development","briefZh":"用于推理（如思维链、扩展思考）的输出 token 数量。","noteZh":"该值宜计入 gen_ai.usage.output_tokens。","reqZh":"推荐 · 适用时","reqFrom":""},{"key":"gen_ai.prompt.name","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["analyze-code"],"req":"条件必填 · when a named prompt template is used","reqCat":"conditional","brief":"The name of the prompt that uniquely identifies it.","note":"","why":"","stability":"development","briefZh":"唯一标识该提示词的名称。","noteZh":"","reqZh":"条件必填 · 使用具名提示词模板时","reqFrom":""},{"key":"gen_ai.prompt.version","type":"string ovider as identified by the client or server instrumentation.","note":"Semantic conventions for individual GenAI operations SHOULD clarify which kinds of providers (e.g. inference, embeddings, retrieval, memory, hosted agent providers) apply when it is not clear from context. The attribute SHOULD be set based on the instrumentation's best knowledge and may differ from the actual upstream provider. For example, a client SDK may be configured against a proxy or hosting platform that transparently relays requests to a different provider. The `gen_ai.provider.name` attribute acts as a discriminator that identifies the GenAI telemetry format flavor specific to that provider within GenAI semantic conventions. It SHOULD be set consistently with provider-specific attributes and signals. For example, GenAI spans, metrics, and events related to AWS Bedrock should have the `gen_ai.provider.name` set to `aws.bedrock` and include applicable `aws.bedrock.*` attributes and are not expected to include `openai.*` attributes.","why":"多厂商共存时唯一能可靠分组的维度","stability":"development","briefZh":"由客户端或服务端埋点库识别出的生成式 AI 提供方。","noteZh":"当上下文不明确时，各 GenAI 操作的语义约定宜说明适用哪些类型的提供方（如推理、嵌入、检索、记忆、托管智能体提供方）。该属性宜基于埋点库的最佳认知设置，可能与实际的上游提供方不同，例如客户端 SDK 可能配置了透明转发请求的代理或托管平台。该属性充当鉴别器，在 GenAI 语义约定中标识该提供方特有的遥测格式风格，宜与提供方特有属性及信号一致：例如 AWS Bedrock 的 span、指标与事件应设为 aws.bedrock，并含适用的 aws.bedrock.* 属性，预期不含 openai.* 属性。","reqZh":"必填","reqFrom":""},{"key":"gen_ai.request.encoding_formats","type":"string[]","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["['base64']","['float', 'binary']"],"req":"推荐","reqCat":"recommended","brief":"The encoding formats requested in an embeddings operation, if specified.","note":"In some GenAI systems the encoding formats are called embedding types. Also, some GenAI systems only accept a single format per request.","why":"","stability":"development","briefZh":"嵌入操作中请求的编码格式（如已指定）。","noteZh":"在某些 GenAI 系统中，编码格式被称为嵌入类型。此外，某些 GenAI 系统每次请求只接受单一格式。","req ity":"development","briefZh":"Agent 所使用的工具类型（function / extension / datastore）。","noteZh":"Extension：在智能体侧执行的工具，用于直接调用外部 API，弥合智能体与真实世界系统之间的差距。智能体侧操作指由智能体在服务端或其受控环境内执行的动作。\nFunction：在客户端执行的工具，智能体为预定义函数生成参数，由客户端执行逻辑。客户端操作指在用户端或客户端应用内执行的动作。\nDatastore：智能体用于访问和查询结构化或非结构化外部数据的工具，服务于检索增强任务或知识更新。","reqZh":"推荐 · 若可得","reqFrom":""},{"key":"gen_ai.agent.name","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["Math Tutor","Fiction Writer"],"req":"条件必填 · When applicable.","reqCat":"conditional","brief":"The human-readable name of the agent executing the tool.","note":"","why":"多 agent 编排里区分是谁在干活","stability":"development","briefZh":"执行该工具的 Agent 的可读名称。","noteZh":"","reqZh":"条件必填 · 适用时","reqFrom":""},{"key":"gen_ai.operation.name","type":"string","typeAlt":"enum","typeEnumCount":18,"values":["chat","generate_content","text_completion","embeddings","retrieval","fetch_response","create_agent","invoke_agent","execute_tool","invoke_workflow","plan","search_memory","create_memory","update_memory","upsert_memory","delete_memory","create_memory_store","delete_memory_store"],"valueBriefs":{"chat":"Chat completion operation such as [OpenAI Chat API](https://platform.openai.com/docs/api-reference/chat)","generate_content":"Multimodal content generation operation such as [Gemini Generate Content](https://ai.google.dev/api/generate-content)","text_completion":"Text completions operation such as [OpenAI Completions API (Legacy)](https://platform.openai.com/docs/api-reference/completions)","embeddings":"Embeddings operation such as [OpenAI Create embeddings API](https://platform.openai.com/docs/api-reference/embeddings/create)","retrieval":"Retrieval operation such as [OpenAI Search Vector Store API](https://platform.openai.com/docs/api-reference/vector-stores/search)","fetch_response":"Fetch a previously generated model response by its identifier, without performing inference, such as [OpenAI Get a model response](https://platform angchain.com/python/langchain-core/runnables/history/RunnableWithMessageHistory), and [Google ADK sessions](https://adk.dev/sessions/session)) - when instrumenting GenAI client libraries that maintain a conversation on the backend (see [AWS Bedrock agent sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html), [OpenAI Assistant threads](https://platform.openai.com/docs/api-reference/threads)) When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value. Application developers that manage conversation history MAY add conversation id to GenAI and other spans or logs using custom span or log record processors or hooks provided by instrumentation libraries.","why":"多轮会话关联；仅当库自身持有会话概念时才有","stability":"development","briefZh":"会话（session、thread）的唯一标识符，用于在该会话内存储和关联消息。","noteZh":"当某次操作可方便获得会话标识符时，埋点库宜填充会话 id，例如：被埋点的客户端框架管理会话历史时（如 LlamaIndex、LangChain、Google ADK 的会话存储），或埋点于在后端维护会话的 GenAI 客户端库时（如 AWS Bedrock、OpenAI Assistant）。没有可用标识符时，埋点库不应填充会话 id；不得用新 UUID、trace 标识符或请求内容哈希作回退值。应用开发者可借助埋点库的自定义 span/日志处理器或钩子，把会话 id 加入 GenAI 及其他 span 或日志。","reqZh":"条件必填 · 若可得","reqFrom":""},{"key":"gen_ai.tool.call.arguments","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["{\n    \"location\": \"San Francisco?\",\n    \"date\": \"2025-10-01\"\n}\n"],"req":"需显式开启","reqCat":"optin","brief":"Parameters passed to the tool call.","note":"> [!WARNING] > This attribute may contain sensitive information. It's expected to be an object - in case a serialized string is available to the instrumentation, the instrumentation SHOULD do the best effort to deserialize it to an object.","why":"按规范内容 schema 序列化；可能含敏感数据，采集前需评估","stability":"development","briefZh":"传给工具调用的参数。","noteZh":"注意：该属性可能包含敏感信息。该值预期为对象；若埋点库只能拿到序列化字符串，宜尽力将其反序列化为对象。","reqZh":"需显式开启","reqFrom":" ":[{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI input (prompt).","note":"This value SHOULD include all types of input tokens, including cached tokens. Instrumentations SHOULD make a best effort to populate this value, using a total provided by the provider when available or, depending on the provider API, by summing different token types parsed from the provider output. When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for. Detailed usage attributes are subsets of total and aggregate counts. For example, if a request has 100 text tokens (40 cached) and 200 image tokens: - `gen_ai.usage.input_tokens`: 300 - `gen_ai.usage.cache_read.input_tokens`: 40 - `gen_ai.usage.text.input_tokens`: 100 - `gen_ai.usage.text.cache_read.input_tokens`: 40 - `gen_ai.usage.image.input_tokens`: 200","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"GenAI 输入（提示词）消耗的 token 数量。","noteZh":"该值宜包含所有类型的输入 token，含缓存 token。埋点库宜尽力填充：提供方给出总量时用该总量，或按提供方 API 对不同类型求和。当提供方同时报告计费数与模型消耗数时（如 Cohere 的 usage.billed_units 与 usage.tokens），宜报告计费数，以匹配客户计费单位。明细用量属性是总量与聚合计数的子集。例如请求含 100 个文本 token（40 个缓存）和 200 个图像 token 时，gen_ai.usage.* 各属性取值为：input_tokens=300，cache_read.input_tokens=40，text.input_tokens=100，text.cache_read.input_tokens=40，image.input_tokens=200。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.usage.output_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["180"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI response (completion).","note":"When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for.","why":"含推理 token 的输出总量","stability":"development","briefZh":"GenAI 响应（补全内容）消耗的 token 数量。","noteZh":"当提供方同时报告计费 token 数与模型消耗 token 数（如 Cohere 同时暴露 usage.billed_units 与 usage.tokens）时，埋点库宜报告计费数，以与客户计费单位一致。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.system_instructions","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"type\": \"text\",\n    \"content\": \"You are an Agent that greet users, always use greetings tool to respond\"\n  }\n]\n","[\n  {\n    \"type\": \"text\",\n    \"content\": \"You are a language translator.\"\n  },\n  {\n    \"type\": \"text\",\n    \"content\": \"Your mission is to translate text in English to French.\"\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The system message or instructions provided to the GenAI model separately from the chat history.","note":"This attribute SHOULD be used when the corresponding provider or API allows to provide system instructions or messages separately from the chat history. Instructions that are part of the chat history SHOULD be recorded in `gen_ai.input.messages` attribute instead. Instrumentations MAY provide a way for users to filter or truncate system instructions. > [!Warning] > This attribute may contain sensitive information. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"系统提示，后端渲染对话时按 role 区分","stability":"development","briefZh":"与聊天历史分开提供给 GenAI 模型的系统消息或指令。","noteZh":"当对应的提供方或 API 允许将系统指令或消息与聊天历史分开提供时，宜使用该属性。属于聊天历史的指令宜记录在 gen_ai.input.messages 属性中。埋点库可以提供让用户过滤或截断系统指令的方式。注意：该属性可能包含敏感信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.input.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"user\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"Weather in Paris?\"\n      }\n    ]\n  },\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"name\": \"get_weather\",\n        \"arguments\": {\n          \"location\": \"Paris\"\n        }\n      }\n    ]\n  },\n  {\n    \"role\": \"tool\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call_response\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"response\": \"rainy, 57°F\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The chat history provided to the model as an input.\n","note":"Messages MUST be provided in the order they were sent to the model. Instrumentations MAY provide a way for users to filter or truncate input messages. > [!Warning] > This attribute is likely to contain sensitive information including user/PII data. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"按规范内容 schema 序列化，角色与 parts 结构固定，后端才能渲染成对话","stability":"development","briefZh":"作为输入提供给模型的聊天历史。","noteZh":"消息必须按发送给模型的顺序提供。埋点库可以提供让用户过滤或截断输入消息的方式。注意：该属性很可能包含敏感信息，包括用户/个人身份信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.output.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"The weather in Paris is currently rainy with a temperature of 57°F.\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"Messages returned by the model where each message represents a specific model response (choice, candidate).","note":"Each message represents a single output choice/candidate generated by the model. Each message corresponds to exactly one generation (choice/candidate) and vice versa - one choice cannot be split across multiple messages or one message cannot contain parts from multiple choices. Instrumentations MAY provide a way for users to filter or truncate output messages. `gen_ai.response.finish_reasons` remains aligned with the generations returned by the provider, not with a filtered or truncated `gen_ai.output.messages` value. > [!Warning] > This attribute is likely to contain sensitive information including user/PII data. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"同上，输出侧","stability":"development","briefZh":"模型返回的消息，每条消息代表一次具体的模型响应（choice、candidate）。","noteZh":"每条消息代表模型生成的一个输出选项/候选结果，二者一一对应：一个选项不得拆分到多条消息，一条消息也不得包含来自多个选项的内容。埋点库可以提供让用户过滤或截断输出消息的方式。gen_ai.response.finish_reasons 始终与提供方返回的生成结果对齐，而不与过滤或截断后的 gen_ai.output.messages 值对齐。注意：该属性很可能包含敏感信息，包括用户/个人身份信息。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.tool.definitions","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"type\": \"function\",\n    \"name\": \"get_current_weather\",\n    \"description\": \"Get the current weather in a given location\",\n    \"parameters\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"location\": {\n          \"type\": \"string\",\n          \"description\": \"The city and state, e.g. San Francisco, CA\"\n        },\n        \"unit\": {\n          \"type\": \"string\",\n          \"enum\": [\n            \"celsius\",\n            \"fahrenheit\"\n          ]\n        }\n      },\n      \"required\": [\n        \"location\",\n        \"unit\"\n      ]\n    }\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The list of tool definitions available to the GenAI agent or model.","note":"> [!WARNING] > This attribute may contain sensitive information. Since pulated for agents that support multiple models or dynamic selection.","why":"请求侧模型名，用于对比「要的」与「实际用的」","stability":"development","briefZh":"为 Agent 配置的 GenAI 模型名称。","noteZh":"当且仅当被埋点的库允许为每个 agent 只设置单个模型时才宜填该属性；对于支持多模型或动态选择的 agent，不宜填该属性。","reqZh":"推荐 · 适用时","reqFrom":""},{"key":"gen_ai.operation.name","type":"string","typeAlt":"enum","typeEnumCount":18,"values":["chat","generate_content","text_completion","embeddings","retrieval","fetch_response","create_agent","invoke_agent","execute_tool","invoke_workflow","plan","search_memory","create_memory","update_memory","upsert_memory","delete_memory","create_memory_store","delete_memory_store"],"valueBriefs":{"chat":"Chat completion operation such as [OpenAI Chat API](https://platform.openai.com/docs/api-reference/chat)","generate_content":"Multimodal content generation operation such as [Gemini Generate Content](https://ai.google.dev/api/generate-content)","text_completion":"Text completions operation such as [OpenAI Completions API (Legacy)](https://platform.openai.com/docs/api-reference/completions)","embeddings":"Embeddings operation such as [OpenAI Create embeddings API](https://platform.openai.com/docs/api-reference/embeddings/create)","retrieval":"Retrieval operation such as [OpenAI Search Vector Store API](https://platform.openai.com/docs/api-reference/vector-stores/search)","fetch_response":"Fetch a previously generated model response by its identifier, without performing inference, such as [OpenAI Get a model response](https://platform.openai.com/docs/api-reference/responses/get)","create_agent":"Create GenAI agent","invoke_agent":"Invoke GenAI agent","execute_tool":"Execute a tool","invoke_workflow":"Invoke GenAI workflow","plan":"Agent planning or task decomposition phase","search_memory":"Search/query memories from a memory store","create_memory":"Create new memory records","update_memory":"Update existing memory records","upsert_memory":"Create or update memory records without the caller choosing which","dele pecific mechanisms.","reqCat":"conditional","brief":"The unique identifier for a conversation (session, thread), used to store and correlate messages within this conversation.","note":"Instrumentations SHOULD populate conversation id when they have an identifier for the conversation readily available for a given operation, for example: - when the client framework being instrumented manages conversation history (see [LlamaIndex chat store](https://docs.llamaindex.ai/en/stable/module_guides/storing/chat_stores/), [LangChain `session_id`](https://reference.langchain.com/python/langchain-core/runnables/history/RunnableWithMessageHistory), and [Google ADK sessions](https://adk.dev/sessions/session)) - when instrumenting GenAI client libraries that maintain a conversation on the backend (see [AWS Bedrock agent sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html), [OpenAI Assistant threads](https://platform.openai.com/docs/api-reference/threads)) When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value. Application developers that manage conversation history MAY add conversation id to GenAI and other spans or logs using custom span or log record processors or hooks provided by instrumentation libraries.","why":"多轮会话关联；仅当库自身持有会话概念时才有","stability":"development","briefZh":"会话（session、thread）的唯一标识符，用于在该会话内存储和关联消息。","noteZh":"当某次操作可方便获得会话标识符时，埋点库宜填充会话 id，例如：被埋点的客户端框架管理会话历史时（如 LlamaIndex、LangChain、Google ADK 的会话存储），或埋点于在后端维护会话的 GenAI 客户端库时（如 AWS Bedrock、OpenAI Assistant）。没有可用标识符时，埋点库不应填充会话 id；不得用新 UUID、trace 标识符或请求内容哈希作回退值。应用开发者可借助埋点库的自定义 span/日志处理器或钩子，把会话 id 加入 GenAI 及其他 span 或日志。","reqZh":"条件必填 · 当且仅当被埋点的库可方便地获得该值，或用户应用通过 OpenTelemetry 上下文或库特定机制提供该值","reqFrom":""},{"key":"gen_ai.data_source.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"value ai.openai":"[Azure OpenAI](https://learn.microsoft.com/en-us/azure/ai-services/openai/overview)","ibm.watsonx.ai":"[IBM Watsonx AI](https://www.ibm.com/products/watsonx-ai)","aws.bedrock":"[AWS Bedrock](https://aws.amazon.com/bedrock)","perplexity":"[Perplexity](https://www.perplexity.ai/)","x_ai":"[xAI](https://x.ai/)","deepseek":"[DeepSeek](https://www.deepseek.com/)","groq":"[Groq](https://groq.com/)","mistral_ai":"[Mistral AI](https://mistral.ai/)","moonshot_ai":"[Moonshot AI](https://www.moonshot.ai/)"},"examples":null,"req":"必填","reqCat":"required","brief":"The Generative AI provider as identified by the client or server instrumentation.","note":"Semantic conventions for individual GenAI operations SHOULD clarify which kinds of providers (e.g. inference, embeddings, retrieval, memory, hosted agent providers) apply when it is not clear from context. The attribute SHOULD be set based on the instrumentation's best knowledge and may differ from the actual upstream provider. For example, a client SDK may be configured against a proxy or hosting platform that transparently relays requests to a different provider. The `gen_ai.provider.name` attribute acts as a discriminator that identifies the GenAI telemetry format flavor specific to that provider within GenAI semantic conventions. It SHOULD be set consistently with provider-specific attributes and signals. For example, GenAI spans, metrics, and events related to AWS Bedrock should have the `gen_ai.provider.name` set to `aws.bedrock` and include applicable `aws.bedrock.*` attributes and are not expected to include `openai.*` attributes.","why":"多厂商共存时唯一能可靠分组的维度","stability":"development","briefZh":"由客户端或服务端埋点库识别出的生成式 AI 提供方。","noteZh":"当上下文不明确时，各 GenAI 操作的语义约定宜说明适用哪些类型的提供方（如推理、嵌入、检索、记忆、托管智能体提供方）。该属性宜基于埋点库的最佳认知设置，可能与实际的上游提供方不同，例如客户端 SDK 可能配置了透明转发请求的代理或托管平台。该属性充当鉴别器，在 GenAI 语义约定中标识该提供方特有的遥测格式风格，宜与提供方特有属性及信号一致：例如 AWS Bedrock 的 span、指标与事件应设为 aws.bedrock，并含适用的 aws.bedrock.* 属性，预期不含 openai.* 属性。","reqZh":"必填","reqFrom":""  due to their transient nature.","why":"","stability":"development","briefZh":"被调用的 GenAI Agent 的稳定唯一标识符。","noteZh":"对于托管智能体，该值宜为提供方分配的智能体资源稳定标识符，如 AWS Bedrock 智能体 ARN 或 GCP Agent Registry 标识符。由于内存中的智能体实例 id 具有瞬态性质，不建议将其记录在该属性上。","reqZh":"条件必填 · 若适用","reqFrom":""},{"key":"gen_ai.agent.version","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["1.0.0","2025-05-01"],"req":"条件必填 · When available.","reqCat":"conditional","brief":"The version of the invoked GenAI agent.","note":"","why":"","stability":"development","briefZh":"被调用的 GenAI Agent 的版本。","noteZh":"","reqZh":"条件必填 · 若可得","reqFrom":""}]},{"ns":"gen-ai","type":"gen_ai.invoke_agent.internal","kind":"internal","brief":"Describes GenAI agent invocation within the same process.","briefZh":"描述同一进程内发起的 GenAI Agent 调用。","identity":"**Span name** SHOULD be `invoke_agent {gen_ai.agent.name}` if `gen_ai.agent.name` is readily available. When `gen_ai.agent.name` is not available, it SHOULD be `invoke_agent`. Semantic conventions for individual GenAI systems and frameworks MAY specify different span name format.","identityZh":"如果 gen_ai.agent.name 可以方便地获取到，span 名宜为 invoke_agent {gen_ai.agent.name}。当 gen_ai.agent.name 不可用时，宜为 invoke_agent。针对各个 GenAI 系统和框架的语义约定可以规定不同的 span 名称格式。","group":"Agent spans","groupFile":"gen-ai-agent-spans.md","groupWhy":"库自身实现 Agent 循环，在同进程内执行","refLibs":["agent-framework","autogen","crewai","google-adk","langchain","openai-agents","pydantic-ai"],"scenario":null,"stability":"development","attrs":[{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI input (prompt).","note":"This value SHOULD include all types of input tokens, including cached tokens. Instrumentations SHOULD make a best effort to populate this value, using a total provided by the provider when available or, depending on the provider API, by summing different token types parsed from the provider output. When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for. Detailed usage attributes are subsets of total and aggregate counts. For example, if a request has 100 text tokens (40 cached) and 200 image tokens: - `gen_ai.usage.input_tokens`: 300 - `gen_ai.usage.cache_read.input_tokens`: 40 - `gen_ai.usage.text.input_tokens`: 100 - `gen_ai.usage.text.cache_read.input_tokens`: 40 - `gen_ai.usage.image.input_tokens`: 200","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"GenAI 输入（提示词）消耗的 token 数量。","noteZh":"该值宜包含所有类型的输入 token，含缓存 token。埋点库宜尽力填充：提供方给出总量时用该总量，或按提供方 API 对不同类型求和。当提供方同时报告计费数与模型消耗数时（如 Cohere 的 usage.billed_units 与 usage.tokens），宜报告计费数，以匹配客户计费单位。明细用量属性是总量与聚合计数的子集。例如请求含 100 个文本 token（40 个缓存）和 200 个图像 token 时，gen_ai.usage.* 各属性取值为：input_tokens=300，cache_read.input_tokens=40，text.input_tokens=100，text.cache_read.input_tokens=40，image.input_tokens=200。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.usage.output_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["180"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI response (completion).","note":"When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for.","why":"含推理 token 的输出总量","stability":"development","briefZh":"GenAI 响应（补全内容）消耗的 token 数量。","noteZh":"当提供方同时报告计费 token 数与模型消耗 token 数（如 Cohere 同时暴露 usage.billed_units 与 usage.tokens）时，埋点库宜报告计费数，以与客户计费单位一致。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.system_instructions","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"type\": \"text\",\n    \"content\": \"You are an Agent that greet users, always use greetings tool to respond\"\n  }\n]\n","[\n  {\n    \"type\": \"text\",\n    \"content\": \"You are a language translator.\"\n  },\n  {\n    \"type\": \"text\",\n    \"content\": \"Your mission is to translate text in English to French.\"\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The system message or instructions provided to the GenAI model separately from the chat history.","note":"This attribute SHOULD be used when the corresponding provider or API allows to provide system instructions or messages separately from the chat history. Instructions that are part of the chat history SHOULD be recorded in `gen_ai.input.messages` attribute instead. Instrumentations MAY provide a way for users to filter or truncate system instructions. > [!Warning] > This attribute may contain sensitive information. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"系统提示，后端渲染对话时按 role 区分","stability":"development","briefZh":"与聊天历史分开提供给 GenAI 模型的系统消息或指令。","noteZh":"当对应的提供方或 API 允许将系统指令或消息与聊天历史分开提供时，宜使用该属性。属于聊天历史的指令宜记录在 gen_ai.input.messages 属性中。埋点库可以提供让用户过滤或截断系统指令的方式。注意：该属性可能包含敏感信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.input.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"user\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"Weather in Paris?\"\n      }\n    ]\n  },\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"name\": \"get_weather\",\n        \"arguments\": {\n          \"location\": \"Paris\"\n        }\n      }\n    ]\n  },\n  {\n    \"role\": \"tool\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call_response\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"response\": \"rainy, 57°F\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The chat history provided to the model as an input.\n","note":"Messages MUST be provided in the order they were sent to the model. Instrumentations MAY provide a way for users to filter or truncate input messages. > [!Warning] > This attribute is likely to contain sensitive information including user/PII data. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"按规范内容 schema 序列化，角色与 parts 结构固定，后端才能渲染成对话","stability":"development","briefZh":"作为输入提供给模型的聊天历史。","noteZh":"消息必须按发送给模型的顺序提供。埋点库可以提供让用户过滤或截断输入消息的方式。注意：该属性很可能包含敏感信息，包括用户/个人身份信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.output.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"The weather in Paris is currently rainy with a temperature of 57°F.\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"Messages returned by the model where each message represents a specific model response (choice, candidate).","note":"Each message represents a single output choice/candidate generated by the model. Each message corresponds to exactly one generation (choice/candidate) and vice versa - one choice cannot be split across multiple messages or one message cannot contain parts from multiple choices. Instrumentations MAY provide a way for users to filter or truncate output messages. `gen_ai.response.finish_reasons` remains aligned with the generations returned by the provider, not with a filtered or truncated `gen_ai.output.messages` value. > [!Warning] > This attribute is likely to contain sensitive information including user/PII data. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"同上，输出侧","stability":"development","briefZh":"模型返回的消息，每条消息代表一次具体的模型响应（choice、candidate）。","noteZh":"每条消息代表模型生成的一个输出选项/候选结果，二者一一对应：一个选项不得拆分到多条消息，一条消息也不得包含来自多个选项的内容。埋点库可以提供让用户过滤或截断输出消息的方式。gen_ai.response.finish_reasons 始终与提供方返回的生成结果对齐，而不与过滤或截断后的 gen_ai.output.messages 值对齐。注意：该属性很可能包含敏感信息，包括用户/个人身份信息。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.tool.definitions","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"type\": \"function\",\n    \"name\": \"get_current_weather\",\n    \"description\": \"Get the current weather in a given location\",\n    \"parameters\": {\n      \"type\": \"object\",\n      \"properties\": {\n        \"location\": {\n          \"type\": \"string\",\n          \"description\": \"The city and state, e.g. San Francisco, CA\"\n        },\n        \"unit\": {\n          \"type\": \"string\",\n          \"enum\": [\n            \"celsius\",\n            \"fahrenheit\"\n          ]\n        }\n      },\n      \"required\": [\n        \"location\",\n        \"unit\"\n      ]\n    }\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The list of tool definitions available to the GenAI agent or model.","note":"> [!WARNING] > This attribute may contain sensitive information. Since this attribute could be large, it's NOT RECOMMENDED to populate non-required properties by default. Instrumentations MAY provide a way to enable populating optional properties.","why":"","stability":"development","briefZh":"GenAI Agent 或模型可用的工具定义列表。","noteZh":"注意：该属性可能包含敏感信息。由于该属性可能很大，不建议默认填充非必需属性。埋点库可以提供开启可选属性填充的方式。","reqZh":"需显式开启","reqFrom":""},{"key":"error.type","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["timeout","java.net.UnknownHostException","server_certificate_invalid","500"],"req":"条件必填 · If the operation ended in an error.","reqCat":"conditional","brief":"Describes a class of error the operation ended with.","note":"The `error.type` SHOULD match the error code returned by the Generative AI provider or the client library, the canonical name of exception that occurred, or another low-cardinality error identifier. Instrumentations SHOULD document the list of errors they report.","why":"","stability":"stable","briefZh":"描述操作结束时所归类的错误类型。","noteZh":"`error.type` 宜与生成式 AI 提供方或客户端库返回的错误码、所抛异常的规范名称，或其它低基数错误标识一致。埋点库宜记录自己会上报哪些错误。","reqZh":"条件必填 · 若该操作以错误结束","reqFrom":""},{"key":"gen_ai.agent.name","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["Math Tutor","Fiction Writer"],"req":"条件必填 · When available.","reqCat":"conditional","brief":"The human-readable name of the invoked GenAI agent.","note":"","why":"多 agent 编排里区分是谁在干活","stability":"development","briefZh":"被调用的 GenAI Agent 的可读名称。","noteZh":"","reqZh":"条件必填 · 若可得","reqFrom":""},{"key":"gen_ai.request.model","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["gpt-4"],"req":"推荐 · If applicable.","reqCat":"recommended","brief":"The name of the GenAI model configured for the agent.","note":"This attribute SHOULD be populated if and only if the instrumented library allows to set only a single model per agent. It SHOULD NOT be populated for agents that support multiple models or dynamic selection.","why":"请求侧模型名，用于对比「要的」与「实际用的」","stability":"development","briefZh":"为 Agent 配置的 GenAI 模型名称。","noteZh":"当且仅当被埋点的库允许为每个 agent 只设置单个模型时才宜填该属性；对于支持多模型或动态选择的 agent，不宜填该属性。","reqZh":"推荐 · 适用时","reqFrom":""},{"key":"gen_ai.operation.name","type":"string","typeAlt":"enum","typeEnumCount":18,"values":["chat","generate_content","text_completion","embeddings","retrieval","fetch_response","cr ponse.finish_reasons","type":"string[]","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["['stop']","['stop', 'length']","['stop', 'length', 'error']"],"req":"推荐","reqCat":"recommended","brief":"Array of reasons the model stopped generating tokens, corresponding to each generation received.","note":"Values correspond to generations in the same order as the returned choices/candidates. Each position SHOULD contain the finish reason for the corresponding choice/candidate. If a finish reason was expected but not received, for example because generation failed, was cancelled, or a stream ended before the final event, instrumentations SHOULD report `error` for that position instead of omitting it. `error` indicates that the generation ended abnormally, whether reported by the provider or inferred by the instrumentation.","why":"stop / length / content_filter / tool_call / compaction / error，判断是否被截断","stability":"development","briefZh":"模型停止生成 token 的原因数组，与收到的各次生成一一对应。","noteZh":"各值按返回的选项/候选结果的相同顺序对应于各次生成。每个位置宜包含对应选项/候选结果的结束原因。若某个结束原因本应出现却未收到，例如生成失败、被取消，或流在最终事件之前结束，埋点库宜在该位置报告 error，而不是省略它。error 表示生成异常结束，无论该信息由提供方报告还是由埋点库推断。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.conversation.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["conv_5j66UpCpwteGg4YSxUnt7lPY"],"req":"条件必填 · If and only if the instrumented library has one readily available, or the user application provides one through OpenTelemetry context or library-specific mechanisms.","reqCat":"conditional","brief":"The unique identifier for a conversation (session, thread), used to store and correlate messages within this conversation.","note":"Instrumentations SHOULD populate conversation id when they have an identifier for the conversation readily available for a given operation, for example: - when the client framework being instrumented manages conversation history (see [LlamaIndex chat store](https://docs.llamaindex.ai/en/stable/module_guides/storing/chat_stores/), [LangChain `session_id`](https://reference.langchain.com/python/langchain-core/runnables/history/RunnableWithMessageHistory), and [Google ADK sessions](https://adk.dev/sessions/session)) - when instrumenting GenAI client libraries that maintain a conversation on the backend (see [AWS Bedrock agent sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html), [OpenAI Assistant threads](https://platform.openai.com/docs/api-reference/threads)) When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value. Application developers that manage conversation history MAY add conversation id to GenAI and other spans or logs using custom span or log record processors or hooks provided by instrumentation libraries.","why":"多轮会话关联；仅当库自身持有会话概念时才有","stability":"development","briefZh":"会话（session、thread）的唯一标识符，用于在该会话内存储和关联消息。","noteZh":"当某次操作可方便获得会话标识符时，埋点库宜填充会话 id，例如：被埋点的客户端框架管理会话历史时（如 LlamaIndex、LangChain、Google ADK 的会话存储），或埋点于在后端维护会话的 GenAI 客户端库时（如 AWS Bedrock、OpenAI Assistant）。没有可用标识符时，埋点库不应填充会话 id；不得用新 UUID、trace 标识符或请求内容哈希作回退值。应用开发者可借助埋点库的自定义 span/日志处理器或钩子，把会话 id 加入 GenAI 及其他 span 或日志。","reqZh":"条件必填 · 当且仅当被埋点的库可方便地获得该值，或用户应用通过 OpenTelemetry 上下文或库特定机制提供该值","reqFrom":""},{"key":"gen_ai.data_source.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["H7STPQYOND"],"req":"条件必填 · If applicable.","reqCat":"conditional","brief":"The data source identifier.","note":"Data sources are used by AI agents and RAG applications to store grounding data. A data source may be an external database, object store, document collection, website, or any other storage system used by the GenAI agent or application. The `gen_ai.data_source.id` SHOULD match the identifier used by the GenAI system  (see [AWS Bedrock agent sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html), [OpenAI Assistant threads](https://platform.openai.com/docs/api-reference/threads)) When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value. Application developers that manage conversation history MAY add conversation id to GenAI and other spans or logs using custom span or log record processors or hooks provided by instrumentation libraries.","why":"多轮会话关联；仅当库自身持有会话概念时才有","stability":"development","briefZh":"会话（session、thread）的唯一标识符，用于在该会话内存储和关联消息。","noteZh":"当某次操作可方便获得会话标识符时，埋点库宜填充会话 id，例如：被埋点的客户端框架管理会话历史时（如 LlamaIndex、LangChain、Google ADK 的会话存储），或埋点于在后端维护会话的 GenAI 客户端库时（如 AWS Bedrock、OpenAI Assistant）。没有可用标识符时，埋点库不应填充会话 id；不得用新 UUID、trace 标识符或请求内容哈希作回退值。应用开发者可借助埋点库的自定义 span/日志处理器或钩子，把会话 id 加入 GenAI 及其他 span 或日志。","reqZh":"条件必填 · 当且仅当被埋点的库可方便地获得该值，或用户应用通过 OpenTelemetry 上下文或库特定机制提供该值","reqFrom":""},{"key":"gen_ai.input.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"user\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"Weather in Paris?\"\n      }\n    ]\n  },\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"name\": \"get_weather\",\n        \"arguments\": {\n          \"location\": \"Paris\"\n        }\n      }\n    ]\n  },\n  {\n    \"role\": \"tool\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call_response\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"response\": \"rainy, 57°F\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The chat history provided to the model as an input.\n","note":"Messages MUST te Content](https://ai.google.dev/api/generate-content)","text_completion":"文本补全操作，例如 [OpenAI Completions API（旧版）](https://platform.openai.com/docs/api-reference/completions)","embeddings":"嵌入操作，例如 [OpenAI Create embeddings API](https://platform.openai.com/docs/api-reference/embeddings/create)","retrieval":"检索操作，例如 [OpenAI Search Vector Store API](https://platform.openai.com/docs/api-reference/vector-stores/search)","fetch_response":"按标识符取回此前生成的模型响应，不执行推理，例如 [OpenAI Get a model response](https://platform.openai.com/docs/api-reference/responses/get)","create_agent":"创建 GenAI agent","invoke_agent":"调用 GenAI agent","execute_tool":"执行工具","invoke_workflow":"调用 GenAI 工作流","plan":"Agent 规划或任务分解阶段","search_memory":"从记忆存储中搜索 / 查询记忆","create_memory":"创建新的记忆记录","update_memory":"更新已有记忆记录","upsert_memory":"创建或更新记忆记录（由实现决定是创建还是更新，调用方不指定）","delete_memory":"删除记忆记录","create_memory_store":"创建或初始化记忆存储","delete_memory_store":"删除或下线记忆存储"},"examples":["execute_tool"],"req":"推荐 · SHOULD be set to `execute_tool` when the operation describes a tool call and SHOULD NOT be set otherwise.","reqCat":"recommended","brief":"The name of the GenAI operation being performed.","note":"Populating this attribute for tool calling along with `mcp.method.name` allows consumers to treat MCP tool calls spans similarly with other tool call types.","why":"决定 span 名与后端聚合口径，是规范里唯一的操作类型枚举","stability":"development","briefZh":"正在执行的操作名称。","noteZh":"在工具调用场景下连同 `mcp.method.name` 一起填这个属性，消费方就能把 MCP 工具调用 span 与其它工具调用类型同等处理。","reqZh":"推荐 · 仅当该操作描述一次工具调用时宜设为 `execute_tool`，否则不应设置本属性","reqFrom":"","valuesApplicable":["execute_tool"],"valuesScopeKind":"restricted"},{"key":"gen_ai.prompt.name","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["analyze-code"],"req":"条件必填 · When operation is related to a specific prompt.","reqCat":"conditional","brief":"The name of the prompt or prompt template provided in the request or response.","note":"","why":"","stability":" nditional","brief":"Describes a class of error the operation ended with.","note":"When the response carries a JSON-RPC error code that classifies as an error, `error.type` SHOULD be set to the string representation of that code. See `rpc.response.status_code` for which codes classify as errors. Otherwise (for example on timeouts or transport errors) it SHOULD be set following the [`error.type`](https://github.com/open-telemetry/semantic-conventions/blob/v1.44.0/docs/registry/attributes/error.md) guidance. When JSON-RPC call is successful, but an error is returned within the result payload, this attribute SHOULD be set to the low-cardinality string representation of the error. When [CallToolResult](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/9c8a44e47e16b789a1f9d47c89ea23ed13a37cf9/schema/2025-06-18/schema.ts#L715) is returned with `isError` set to `true`, this attribute SHOULD be set to `tool_error`.","why":"","stability":"stable","briefZh":"描述操作结束时所归类的错误类型。","noteZh":"当响应携带被归类为错误的 JSON-RPC 错误码时，`error.type` 宜设为该错误码的字符串表示；哪些错误码算错误见 `rpc.response.status_code`。其它情况（例如超时或传输错误）宜按 [`error.type`](https://github.com/open-telemetry/semantic-conventions/blob/v1.44.0/docs/registry/attributes/error.md) 的指引设置。JSON-RPC 调用成功、但结果负载里返回了错误时，该属性宜设为该错误的低基数字符串表示；返回的 [CallToolResult](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/9c8a44e47e16b789a1f9d47c89ea23ed13a37cf9/schema/2025-06-18/schema.ts#L715) 中 `isError` 为 `true` 时，该属性宜设为 `tool_error`。","reqZh":"条件必填 · 当且仅当该操作失败","reqFrom":""},{"key":"mcp.method.name","type":"string","typeAlt":"enum","typeEnumCount":25,"values":["notifications/cancelled","initialize","notifications/initialized","notifications/progress","ping","resources/list","resources/templates/list","resources/read","notifications/resources/list_changed","resources/subscribe","resources/unsubscribe","notifications/resources/updated","prompts/list","prompts/get","notifications/prompts/list_changed","tools/list","tools/call","notifica mation from the user via the client"},"valueBriefsZh":{"notifications/cancelled":"取消先前所发请求的通知。","initialize":"请求初始化 MCP 客户端。","notifications/initialized":"表示 MCP 客户端已完成初始化的通知。","notifications/progress":"表示长耗时操作进度的通知。","ping":"请求检查对端是否仍在线。","resources/list":"请求列出服务端可用的资源。","resources/templates/list":"请求列出服务端可用的资源模板。","resources/read":"请求读取一个资源。","notifications/resources/list_changed":"表示资源列表已变更的通知。","resources/subscribe":"请求订阅一个资源。","resources/unsubscribe":"请求取消订阅资源更新。","notifications/resources/updated":"表示某个资源已更新的通知。","prompts/list":"请求列出服务端可用的提示词。","prompts/get":"请求获取一个提示词。","notifications/prompts/list_changed":"表示提示词列表已变更的通知。","tools/list":"请求列出服务端可用的工具。","tools/call":"请求调用一个工具。","notifications/tools/list_changed":"表示工具列表已变更的通知。","logging/setLevel":"请求设置日志级别。","notifications/message":"表示收到一条消息的通知。","sampling/createMessage":"请求创建一条采样消息。","completion/complete":"请求补全一个提示词。","roots/list":"请求列出服务端可用的 roots。","notifications/roots/list_changed":"表示 roots 列表已变更的通知。","elicitation/create":"服务端经由客户端向用户索取补充信息的请求"},"examples":null,"req":"必填","reqCat":"required","brief":"The name of the request or notification method.","note":"","why":"","stability":"development","briefZh":"请求或通知的方法名。","noteZh":"","reqZh":"必填","reqFrom":""},{"key":"mcp.protocol.version","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["2025-06-18"],"req":"推荐","reqCat":"recommended","brief":"The [version](https://modelcontextprotocol.io/specification/versioning) of the Model Context Protocol used.","note":"","why":"","stability":"development","briefZh":"所使用的 Model Context Protocol 版本。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"network.transport","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["tcp","quic","pipe"],"req":"推荐","reqCat":"recommended","brief":"The transport protocol used for the MCP session.","note":"This attribute SHOULD be set to `tcp` or `quic` if the transport protocol ":"标识 MCP 会话。","noteZh":"","reqZh":"推荐 · 当 MCP 请求或通知属于某个会话时","reqFrom":""},{"key":"mcp.resource.uri","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["postgres://database/customers/schema","file:///home/user/documents/report.pdf"],"req":"条件必填 · When the client executes a request type that includes a resource URI parameter.","reqCat":"conditional","brief":"The value of the resource uri.","note":"This is a URI of the resource provided in the following requests or notifications: `resources/read`, `resources/subscribe`, `resources/unsubscribe`, or `notifications/resources/updated`.","why":"","stability":"development","briefZh":"资源 URI 的值。","noteZh":"该值是下列请求或通知中提供的资源的 URI：resources/read、resources/subscribe、resources/unsubscribe 或 notifications/resources/updated。","reqZh":"条件必填 · 当客户端执行的请求类型包含资源 URI 参数时","reqFrom":""},{"key":"jsonrpc.request.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["10","request-7"],"req":"条件必填 · When the client executes a request.","reqCat":"conditional","brief":"A string representation of the `id` property of the request and its corresponding response.","note":"Under the JSON-RPC specification, the `id` property may be a string, number, null, or omitted entirely. When omitted, the request is treated as a notification. Using `null` is not equivalent to omitting the id, but it is discouraged. Instrumentations SHOULD NOT capture this attribute when the `id` is null or omitted.","why":"","stability":"development","briefZh":"请求及其对应响应中 `id` 属性的字符串表示。","noteZh":"按 JSON-RPC 规范，`id` 属性可以是字符串、数字、null，也可以完全省略；省略时该请求被视为通知。用 `null` 与省略 id 并不等价，但不推荐这样做。当 `id` 为 null 或被省略时，埋点库不宜采集该属性。","reqZh":"条件必填 · 当客户端执行请求时","reqFrom":""},{"key":"server.address","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["example.com","10.1.2.80","/tmp/my.sock"],"req":"推荐 · If applicable.","reqCat ma#prompt) supplied in `prompts/get` requests SHOULD be recorded as `gen_ai.prompt.variable.<argument_name>` attributes. > [!Warning] > This attribute may contain sensitive information.","why":"","stability":"development","briefZh":"请求中提供给提示词模板的变量。","noteZh":"提示词模板由运行时填充的变量参数化。该属性记录传给模板的变量值：属性名给出变量名，属性值是序列化成字符串的变量值。例如变量 `user_name` 取值 `Alice`，宜记录为 `gen_ai.prompt.variable.user_name` 属性，值为 `\"Alice\"`；变量 `language` 取值 `French`，宜记录为 `gen_ai.prompt.variable.language`，值为 `\"French\"`。在 MCP 中，`prompts/get` 请求里提供的 [prompt 参数](https://modelcontextprotocol.io/specification/2025-11-25/schema#prompt) 宜记录为 `gen_ai.prompt.variable.<argument_name>` 属性。注意：该属性可能包含敏感信息。","reqZh":"需显式开启","reqFrom":""},{"key":"error.type","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["timeout","java.net.UnknownHostException","server_certificate_invalid","500"],"req":"条件必填 · If and only if the operation fails.","reqCat":"conditional","brief":"Describes a class of error the operation ended with.","note":"When the response carries a JSON-RPC error code that classifies as an error, `error.type` SHOULD be set to the string representation of that code. See `rpc.response.status_code` for which codes classify as errors. Otherwise (for example on timeouts or transport errors) it SHOULD be set following the [`error.type`](https://github.com/open-telemetry/semantic-conventions/blob/v1.44.0/docs/registry/attributes/error.md) guidance. When JSON-RPC call is successful, but an error is returned within the result payload, this attribute SHOULD be set to the low-cardinality string representation of the error. When [CallToolResult](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/9c8a44e47e16b789a1f9d47c89ea23ed13a37cf9/schema/2025-06-18/schema.ts#L715) is returned with `isError` set to `true`, this attribute SHOULD be set to `tool_error`.","why":"","stability":"stable","briefZh":"描述操作结束时所归类的错误类型。","noteZh":"当响应携带被归类为错误的 JSON-RPC 错误码时，`e
