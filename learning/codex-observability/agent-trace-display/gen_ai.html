est-7"],"req":"条件必填 · When the client executes a request.","reqCat":"conditional","brief":"A string representation of the `id` property of the request and its corresponding response.","note":"Under the JSON-RPC specification, the `id` property may be a string, number, null, or omitted entirely. When omitted, the request is treated as a notification. Using `null` is not equivalent to omitting the id, but it is discouraged. Instrumentations SHOULD NOT capture this attribute when the `id` is null or omitted.","why":"","stability":"development","briefZh":"请求及其对应响应中 `id` 属性的字符串表示。","noteZh":"按 JSON-RPC 规范，`id` 属性可以是字符串、数字、null，也可以完全省略；省略时该请求被视为通知。用 `null` 与省略 id 并不等价，但不推荐这样做。当 `id` 为 null 或被省略时，埋点库不宜采集该属性。","reqZh":"条件必填 · 当客户端执行请求时","reqFrom":""},{"key":"rpc.response.status_code","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["OK","DEADLINE_EXCEEDED","-32602"],"req":"条件必填 · If response contains an error code.","reqCat":"conditional","brief":"The error code from the JSON-RPC response.","note":"This attribute records the [JSON-RPC error code](https://www.jsonrpc.org/specification#error_object) returned in the error response. The following error codes indicate that the caller sent a request the receiver could not serve and SHOULD NOT be considered errors: - `-32700` (`Parse error`) - `-32600` (`Invalid Request`) - `-32601` (`Method not found`) - `-32602` (`Invalid params`) - also returned when the requested tool does not exist - `-32002` ([`Resource not found`](https://modelcontextprotocol.io/specification/2025-11-25/server/resources#error-handling)) Any other error code SHOULD be considered an error.","why":"","stability":"rc","briefZh":"JSON-RPC 响应返回的错误码。","noteZh":"该属性记录错误响应中返回的 [JSON-RPC 错误码](https://www.jsonrpc.org/specification#error_object)。下列错误码表示调用方发来的请求接收方无法处理，不宜视为错误：`-32700`（`Parse error`）、`-32600`（`Invalid Request`）、`-32601`（`Method not found`）、`-32602`（`Invalid params`，请求的工具不存在时也会返回）、`-32002`（[`Resource not found`](https://modelcontextprotocol.io/specification/2025-11-25/server/resources#error-handling)）。其它错误码都宜视为错误。","reqZh":"条件必填 · 若响应包含错误码","reqFrom":""},{"key":"client.address","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["client.example.com","10.1.2.80","/tmp/my.sock"],"req":"推荐 · If applicable.","reqCat":"recommended","brief":"Client address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name.","note":"When observed from the server side, and when communicating through an intermediary, `client.address` SHOULD represent the client address behind any intermediaries, for example proxies, if it's available.","why":"","stability":"stable","briefZh":"客户端地址：可用时为域名（不做反向 DNS 查询），否则为 IP 地址或 UNIX 域套接字名称。","noteZh":"从服务端侧观测、且经过中间层通信时，`client.address` 宜表示中间层（如代理）背后的客户端地址（若可得）。","reqZh":"推荐 · 适用时","reqFrom":""},{"key":"client.port","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["65123"],"req":"推荐 · When `client.address` is set.","reqCat":"recommended","brief":"Client port number.","note":"When observed from the server side, and when communicating through an intermediary, `client.port` SHOULD represent the client port behind any intermediaries, for example proxies, if it's available.","why":"","stability":"stable","briefZh":"客户端端口号。","noteZh":"从服务端侧观测、且经过中间层通信时，`client.port` 宜表示中间层（如代理）背后的客户端端口（若可得）。","reqZh":"推荐 · 当设置了 client.address 时","reqFrom":""},{"key":"gen_ai.tool.call.arguments","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["{\n    \"location\": \"San Francisco?\",\n    \"date\": \"2025-10-01\"\n}\n"],"req":"需显式开启","reqCat":"optin","brief":"Parameters passed to the tool call.","note":"> [!WARNING] > This attribute may contain sensitive information. It's expected to be an object - in case a serialized string is available to t t.type","type":"string","typeAlt":"enum","typeEnumCount":4,"values":["text","json","image","speech"],"valueBriefs":{"text":"Plain text","json":"JSON object with known or unknown schema","image":"Image","speech":"Speech"},"valueBriefsZh":{"text":"纯文本","json":"JSON 对象，schema 已知或未知","image":"图像","speech":"语音"},"examples":null,"req":"条件必填 · When applicable and if the request includes an output format.","reqCat":"conditional","brief":"Represents the content type requested by the client.","note":"This attribute SHOULD be set to the output type requested by the client: - `json` for structured outputs with defined or undefined schema - `image` for image output - `speech` for speech output - `text` for plain text output The attribute specifies the output modality and not the actual output format. For example, if an image is requested, the actual output could be a URL pointing to an image file. Additional output format details may be recorded in the future in the `gen_ai.output.{type}.*` attributes.","why":"","stability":"development","briefZh":"客户端请求的内容类型（text / json / image / speech）。","noteZh":"该属性宜设置为客户端请求的输出类型：结构化输出（无论 schema 是否已定义）用 `json`，图像输出用 `image`，语音输出用 `speech`，纯文本输出用 `text`。该属性指定的是输出模态，而不是实际的输出格式 —— 例如请求图像时，实际输出可能是指向图像文件的 URL。未来可能在 `gen_ai.output.{type}.*` 属性中记录更多输出格式细节。","reqZh":"条件必填 · 若适用且该请求包含输出格式","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.request.model","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["gpt-4"],"req":"必填","reqCat":"required","brief":"The name of the GenAI model a request is being made to.","note":"The name of the GenAI model a request is being made to. If the model is supplied by a vendor, then the value must be the exact name of the model requested. If the model is a fine-tuned custom model, the value should have a more specific name than the base model that's been fine-tuned.","why":"请求侧模型名，用于对比「要的」与「实际用的」","stability":"development","briefZh":"请求所调用的 GenAI 模型名称。","noteZh":"请求所调用的 GenAI 模型名称。若模型由厂商提供，取值必须是所请求模型的准确名称；若是微调的自定义模型，应使用比被微调的基础模型更具体的名称。","reqZh":"必填","reqFrom":""},{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI input (prompt).","note":"The total input token count is returned by `usage.input_tokens` or a similar property in the model response.","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"GenAI 输入（提示词）消耗的 token 数量。","noteZh":"输入 token 总数取自模型响应里的 `usage.input_tokens` 或类似字段。","reqZh":"推荐","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.cache_read.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["50"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The number of input tokens served from a provider-managed cache.","note":"Corresponds to `usage.input_tokens_details.cached_tokens` or a similar property in the model response.","why":"命中厂商侧缓存的输入 token，用于算缓存收益","stability":"development","briefZh":"由提供方管理的缓存提供的输入 token 数量。","noteZh":"对应模型响应里的 `usage.input_tokens_details.cached_tokens` 或类似字段。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.reasoning.output_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["50"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The number of output tokens used for reasoning (e.g. chain-of-thought, extended thinking).","note":"Corresponds to `usage.output_tokens_details.reasoning_tokens` in the model response.","why":"推理模型用于思考的 token，单独拆出才能算清单价","stability":"development","briefZh":"用于推理（如思维链、扩展思考）的输出 token 数量。","noteZh":"对应模型响应里的 `usage.output_tokens_details.reasoning_tokens`。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.request.reasoning.level","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["low","medium","high"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The reasoning or thinking effort level requested for a GenAI model.\n","note":"Corresponds to the [`reasoning.effort`](https://platform.openai.com/docs/guides/reasoning#reasoning-effort) request parameter.","why":"推理强度档位，直接影响成本","stability":"development","briefZh":"为 GenAI 模型请求的推理或思考强度级别（low / medium / high）。","noteZh":"对应请求参数 [`reasoning.effort`](https://platform.openai.com/docs/guides/reasoning#reasoning-effort)。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"},{"key":"openai.request.service_tier","type":"string","typeAlt":"enum","typeEnumCount":2,"values":["auto","default"],"valueBriefs":{"auto":"The system will utilize scale tier credits until they are exhausted.","default":"The system will utilize the default scale tier."},"valueBriefsZh":{"auto":"系统会一直使用 scale tier 额度，直到用尽。","default":"系统使用默认的 scale tier。"},"examples":["auto","default"],"req":"条件必填 · If the request includes a service_tier and the value is not 'auto'.","reqCat":"conditional","brief":"The service tier requested. May be a specific tier, default, or auto.","note":"","why":"","stability":"development","briefZh":"请求的服务层级，可以是具体层级、default 或 auto。","noteZh":"","reqZh":"条件必填 · 若请求包含 service_tier 且取值不为 auto","reqFrom":""},{"key":"openai.response.service_tier","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["scale","default"],"req":"条件必填 · If the response was received and includes a service_tier.","reqCat":"conditional","brief":"The service tier used for the response.","note":"","why":"","stability":"development","briefZh":"该响应所使用的服务层级。","noteZh":"","reqZh":"条件必填 · 若已收到响应且其中包含 service_tier","reqFrom":""},{"key":"openai.response.system_fingerprint","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["fp_44709d6fcb"],"req":"推荐","reqCat":"recommended","brief":"A fingerprint to track any eventual change in the Generative AI environment.","note":"","why":"","stability":"development","briefZh":"用于跟踪生成式 AI 环境可能发生的任何变化的指纹。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"openai.api.type","type":"string","typeAlt":"enum","typeEnumCount":2,"values":["chat_completions","responses"],"valueBriefs":{"chat_completions":"The OpenAI [Chat Completions API](https://developers.openai.com/api/reference/chat-completions/overview).","responses":"The OpenAI [Responses API](https://developers.openai.com/api/reference/responses/overview)."},"valueBriefsZh":{"chat_completions":"OpenAI 的 [Chat Completions API](https://developers.openai.com/api/reference/chat-completions/overview)。","responses":"OpenAI 的 [Responses API](https://developers.openai.com/api/reference/responses/overview)。"},"examples":null,"req":"推荐","reqCat":"recommended","brief":"The type of OpenAI API being used.","note":"","why":"","stability":"development","briefZh":"所用的 OpenAI API 类型（chat_completions / responses）。","noteZh":"","reqZh":"推荐","reqFrom":""}]},{"ns":"gen-ai","type":"openai.fetch_response.client","kind":"refinement","baseKind":"client","refines":"gen_ai.fetch_response.client","brief":"Semantic Conventions for the [OpenAI](https://openai.com/) [Get a model response](https://platform.openai.com/docs/api-reference/responses/get) operation extend and override the semantic conventions for [Gen AI Spans](gen-ai-spans.md).","briefZh":"OpenAI 的获取模型响应操作的语义约定，它扩展并覆盖 Gen AI span 的语义约定。","identity":"Describes the [OpenAI Get a model response](https://platform.openai.com/docs/api-reference/responses/get) operation, which fetches a stored response from the Responses API by its identifier. No inference is performed and no tokens are consumed by this operation. `gen_ai.provider.name` MUST be set to `\"openai\"` and SHOULD be provided **at span creation time**.","identityZh":"描述 OpenAI 的获取模型响应操作，该操作按标识符从 Responses API 获取已存储的响应。此操作不执行推理，也不消耗 token。gen_ai.provider.name 必须设置为 \"openai\"，且宜在 span 创建时提供。","group":"provider 特化","groupFile":"span_refinements","groupWhy":"在 gen_ai.fetch_response.client 的基础上，只补该 provider 独有的字段；其余字段与基础 span 完全一致，不重复定义。","refLibs":["openai"],"scenario":[{"lib":"openai","src":"reference/scenarios/openai/scenario.py","items":[["取回已存储的响应","先用 create(..., store=True) 生成并保存一条响应，再按 id 取回。那次 create 属于推理操作，不包进本条 span —— span 只覆盖 retrieve 这一次调用，字段值也都取自这个调用边界。"],["后台流式响应中断后从断点续取","用 background=True、stream=True 创建响应，消费到调用方断开后记下最后一个事件的 sequence_number，再用它（OpenAI 的 starting_after / Google 的 last_event_id）续取；该游标记入 gen_ai.request.stream_cursor。"],["取回原始生成失败的响应","取回本身是成功的，失败只体现在内容里：status=failed 推导出 finish_reasons=[error]。这次 fetch 不设 error.type、span 也不标 ERROR；仍在 queued / in_progress 的响应则没有 finish reason。"]]}],"stability":"development","attrs":[{"key":"openai.api.type","type":"string","typeAlt":"enum","typeEnumCount":2,"values":["chat_completions","responses"],"valueBriefs":{"chat_completions":"The OpenAI [Chat Completions API](https://developers.openai.com/api/reference/chat-completions/overview).","responses":"The OpenAI [Responses API](https://developers.openai.com/api/reference/responses/overview)."},"valueBriefsZh":{"chat_completions":"OpenAI 的 [Chat Completions API](https://developers.openai.com/api/reference/chat-completions/overview)。","responses":"OpenAI 的 [Responses API](https://developers.openai.com/api/reference/responses/overview)。"},"examples":null,"req":"推荐","reqCat":"recommended","brief":"The type of OpenAI API being used.","note":"For this operation `openai.api.type` SHOULD be set to `responses`.","why":"","stability":"development","briefZh":"所用的 OpenAI API 类型（chat_completions / responses）。","noteZh":"本操作中 `openai.api.type` 宜设置为 `responses`。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.response.status","type":"string","typeAlt":"enum","typeEnumCount":6,"values":["queued","in_progress","completed","incomplete","failed","cancelled"],"valueBriefs":{"queued":"The response has been accepted by the provider but generation has not started yet.","in_progress":"The response is still being generated, for example a background or streamed response that has not finished.","completed":"The response finished generating successfully.","incomplete":"The response stopped before generation completed, for example because a token limit or content filter was reached.","failed":"The response generation failed with an error.","cancelled":"The response generation was cancelled before it completed."},"valueBriefsZh":{"queued":"提供方已接受该响应，但生成尚未开始。","in_progress":"响应仍在生成中，例如尚未结束的后台或流式响应。","completed":"响应已成功生成完毕。","incomplete":"响应在生成完成前停止，例如触达 token 上限或内容过滤器。","failed":"响应生成因错误而失败。","cancelled":"响应生成在完成前被取消。"},"examples":["completed","in_progress"],"req":"推荐","reqCat":"recommended","brief":"The lifecycle status of a generated response, as reported by the provider when the response is fetched or polled.","note":"Set from the fetched response `status` field, whose values (`queued`, `in_progress`, `completed`, `incomplete`, `failed`, `cancelled`) map directly onto this attribute.","why":"","stability":"development","briefZh":"由提供方在获取或轮询响应时报告的生成响应生命周期状态。","noteZh":"取自被取回响应的 `status` 字段，其取值（`queued`、`in_progress`、`completed`、`incomplete`、`failed`、`cancelled`）直接对应本属性的取值。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.response.finish_reasons","type":"string[]","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["['stop']","['stop', 'length']","['stop', 'length', 'error']"],"req":"推荐","reqCat":"recommended","brief":"Array of reasons the model stopped generating tokens, corresponding to each generation received.","note":"Derived from the fetched response `status`: a `completed` response maps to its stop reason, a `failed` or `cancelled` response to `error`, and an `incomplete` response to its `incomplete_details.reason` (for example `max_output_tokens` maps to `length` and `content_filter` to `content_filter`).","why":"stop / length / content_filter / tool_call / compaction / error，判断是否被截断","stability":"development","briefZh":"模型停止生成 token 的原因数组，与收到的各次生成一一对应。","noteZh":"由被取回响应的 `status` 推导：`completed` 映射为它的停止原因；`failed` 或 `cancelled` 映射为 `error`；`incomplete` 映射为它的 `incomplete_details.reason`（例如 `max_output_tokens` 映射为 `length`，`content_filter` 映射为 `content_filter`）。","reqZh":"推荐","reqFrom":""},{"key":"openai.response.service_tier","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["scale","default"],"req":"条件必填 · If the response was received and includes a service_tier.","reqCat":"conditional","brief":"The service tier used for the response.","note":"","why":"","stability":"development","briefZh":"该响应所使用的服务层级。","noteZh":"","reqZh":"条件必填 · 若已收到响应且其中包含 service_tier","reqFrom":""}]},{"ns":"gen-ai","type":"azure.ai.inference.client","kind":"refinement","baseKind":"client","refines":"gen_ai.inference.client","brief":"Semantic Conventions for [Azure AI Inference](https://learn.microsoft.com/rest/api/microsoft-foundry/modelinference/) client spans extend and override the semantic conventions for [Gen AI Spans](gen-ai-spans.md).","briefZh":"Azure AI Inference 客户端 span 的语义约定，它扩展并覆盖 Gen AI span 的语义约定。","identity":"`gen_ai.provider.name` MUST be set to `\"azure.ai.inference\"` and SHOULD be provided **at span creation time**.","identityZh":"gen_ai.provider.name 必须设置为 \"azure.ai.inference\"，且宜在 span 创建时提供。","group":"provider 特化","groupFile":"span_refinements","groupWhy":"在 gen_ai.inference.client 的基础上，只补该 provider 独有的字段；其余字段与基础 span 完全一致，不重复定义。","refLibs":["agent-framework","anthropic","aws-bedrock","azure-ai-inference","azure-openai","claude-agent-sdk","cohere","google-genai","groq","litellm","mistralai","openai","vertexai"],"scenario":null,"stability":"development","attrs":[{"key":"gen_ai.output.type","type":"string","typeAlt":"enum","typeEnumCount":4,"values":["text","json","image","speech"],"valueBriefs":{"text":"Plain text","json":"JSON object with known or unknown schema","image":"Image","speech":"Speech"},"valueBriefsZh":{"text":"纯文本","json":"JSON 对象，schema 已知或未知","image":"图像","speech":"语音"},"examples":null,"req":"条件必填 · When applicable and if the request includes an output format.","reqCat":"conditional","brief":"Represents the content type requested by the client.","note":"This attribute SHOULD be set to the output type requested by the client: - `json` for structured outputs with defined or undefined schema - `image` for image output - `speech` for speech output - `text` for plain text output The attribute specifies the output modality and not the actual output format. For example, if an image is requested, the actual output could be a URL pointing to an image file. Additional output format details may be recorded in the future in the `gen_ai.output.{type}.*` attributes.","why":"","stability":"development","briefZh":"客户端请求的内容类型（text / json / image / speech）。","noteZh":"该属性宜设置为客户端请求的输出类型：结构化输出（无论 schema 是否已定义）用 `json`，图像输出用 `image`，语音输出用 `speech`，纯文本输出用 `text`。该属性指定的是输出模态，而不是实际的输出格式 —— 例如请求图像时，实际输出可能是指向图像文件的 URL。未来可能在 `gen_ai.output.{type}.*` 属性中记录更多输出格式细节。","reqZh":"条件必填 · 若适用且该请求包含输出格式","reqFrom":"gen_ai.inference.client"},{"key":"azure.resource_provider.namespace","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["Microsoft.CognitiveServices"],"req":"推荐","reqCat":"recommended","brief":"Azure Resource Provider Namespace as recognized by the client.","note":"When `azure.resource_provider.namespace` attribute is populated, it MUST be set to `Microsoft.CognitiveServices` for all operations performed by Azure AI Inference clients.","why":"","stability":"development","briefZh":"客户端识别出的 Azure 资源提供方命名空间。","noteZh":"Azure AI Inference 客户端执行的所有操作，只要填了 `azure.resource_provider.namespace`，就必须设置为 `Microsoft.CognitiveServices`。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of prompt tokens as reported in the usage prompt_tokens property of the response.\n","note":"This value SHOULD include all types of input tokens, including cached tokens. Instrumentations SHOULD make a best effort to populate this value, using a total provided by the provider when available or, depending on the provider API, by summing different token types parsed from the provider output. When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for. Detailed usage attributes are subsets of total and aggregate counts. For example, if a request has 100 text tokens (40 cached) and 200 image tokens: - `gen_ai.usage.input_tokens`: 300 - `gen_ai.usage.cache_read.input_tokens`: 40 - `gen_ai.usage.text.input_tokens`: 100 - `gen_ai.usage.text.cache_read.input_tokens`: 40 - `gen_ai.usage.image.input_tokens`: 200","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"响应 usage.prompt_tokens 属性所报告的提示 token 数量。","noteZh":"该值宜包含所有类型的输入 token，含缓存 token。埋点库宜尽力填充：提供方给出总量时用该总量，或按提供方 API 对不同类型求和。当提供方同时报告计费数与模型消耗数时（如 Cohere 的 usage.billed_units 与 usage.tokens），宜报告计费数，以匹配客户计费单位。明细用量属性是总量与聚合计数的子集。例如请求含 100 个文本 token（40 个缓存）和 200 个图像 token 时，gen_ai.usage.* 各属性取值为：input_tokens=300，cache_read.input_tokens=40，text.input_tokens=100，text.cache_read.input_tokens=40，image.input_tokens=200。","reqZh":"推荐","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.output_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["180"],"req":"推荐","reqCat":"recommended","brief":"The number of completion tokens as reported in the usage completion_tokens property of the response.\n","note":"When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for.","why":"含推理 token 的输出总量","stability":"development","briefZh":"响应 usage.completion_tokens 属性所报告的补全 token 数量。","noteZh":"当提供方同时报告计费 token 数与模型消耗 token 数（如 Cohere 同时暴露 usage.billed_units 与 usage.tokens）时，埋点库宜报告计费数，以与客户计费单位一致。","reqZh":"推荐","reqFrom":"gen_ai.inference.client"},{"key":"server.port","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["80","8080","443"],"req":"条件必填 · If not default (443).","reqCat":"conditional","brief":"GenAI server port.","note":"When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent the server port behind any intermediaries, for example proxies, if it's available.","why":"来自核心语义约定，非 gen_ai 专有","stability":"stable","briefZh":"GenAI 服务器端口。","noteZh":"从客户端侧观测、且经过中间层通信时，`server.port` 宜表示中间层（如代理）背后的服务端端口（若可得）。","reqZh":"条件必填 · 若不是默认值（443）","reqFrom":""}]},{"ns":"gen-ai","type":"anthropic.inference.client","kind":"refinement","baseKind":"client","refines":"gen_ai.inference.client","brief":"Semantic Conventions for [Anthropic](https://www.anthropic.com/) client spans extend and override the semantic conventions for [Gen AI Spans](gen-ai-spans.md).","briefZh":"Anthropic 客户端 span 的语义约定，它扩展并覆盖 Gen AI span 的语义约定。","identity":"`gen_ai.provider.name` MUST be set to `\"anthropic\"` and SHOULD be provided **at span creation time**.","identityZh":"gen_ai.provider.name 必须设置为 \"anthropic\"，且宜在 span 创建时提供。","group":"provider 特化","groupFile":"span_refinements","groupWhy":"在 gen_ai.inference.client 的基础上，只补该 provider 独有的字段；其余字段与基础 span 完全一致，不重复定义。","refLibs":["agent-framework","anthropic","aws-bedrock","azure-ai-inference","azure-openai","claude-agent-sdk","cohere","google-genai","groq","litellm","mistralai","openai","vertexai"],"scenario":null,"stability":"development","attrs":[{"key":"gen_ai.request.top_k","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["40"],"req":"推荐","reqCat":"recommended","brief":"The top-K sampling setting for the GenAI request: restricts token generation at each step to the K most likely next tokens.\n","note":"This is a decoding/sampling parameter (e.g., Anthropic `top_k`, Cohere `k`, Google `topK`), not an output-shaping parameter. In particular, OpenAI's `top_logprobs` controls how many per-token log-probabilities are returned in the response and does not change generation; it MUST NOT be reported as `gen_ai.request.top_k`.","why":"","stability":"development","briefZh":"GenAI 请求的 top_k 采样设置：每步只从最可能的 K 个 token 中生成。","noteZh":"这是解码/采样参数（如 Anthropic 的 top_k、Cohere 的 k、Google 的 topK），而不是塑造输出的参数。特别地，OpenAI 的 top_logprobs 控制响应中返回多少个逐 token 对数概率，并不改变生成结果，因此不得将其报告为 gen_ai.request.top_k。","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.reasoning.level","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["low","medium","high"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The reasoning or thinking effort level requested for a GenAI model.\n","note":"Corresponds to the [`output_config.effort`](https://docs.anthropic.com/en/docs/build-with-claude/effort) request parameter.","why":"推理强度档位，直接影响成本","stability":"development","briefZh":"为 GenAI 模型请求的推理或思考强度级别（low / medium / high）。","noteZh":"对应请求参数 [`output_config.effort`](https://docs.anthropic.com/en/docs/build-with-claude/effort)。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI input (prompt).","note":"Anthropic `input_tokens` excludes cached tokens. Compute: `gen_ai.usage.input_tokens = input_tokens + cache_read_input_tokens + cache_write_input_tokens`","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"GenAI 输入（提示词）消耗的 token 数量。","noteZh":"Anthropic 的 `input_tokens` 不含缓存 token。换算方式：`gen_ai.usage.input_tokens = input_tokens + cache_read_input_tokens + cache_write_input_tokens`。","reqZh":"推荐","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.cache_read.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["50"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The number of input tokens served from a provider-managed cache.","note":"Anthropic reports this separately from `input_tokens`. This value MUST be added to the Anthropic `input_tokens` to compute `gen_ai.usage.input_tokens`.","why":"命中厂商侧缓存的输入 token，用于算缓存收益","stability":"development","briefZh":"由提供方管理的缓存提供的输入 token 数量。","noteZh":"Anthropic 把这个值与 `input_tokens` 分开上报。计算 `gen_ai.usage.input_tokens` 时，必须把它加到 Anthropic 的 `input_tokens` 上。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"},{"key":"gen_ai.usage.cache_write.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["25"],"req":"推荐 · When applicable.","reqCat":"recommended","brief":"The number of input tokens written to a provider-managed cache.","note":"Anthropic reports this separately from `input_tokens`. This value MUST be added to the Anthropic `input_tokens` to compute `gen_ai.usage.input_tokens`.","why":"写入厂商侧缓存的输入 token，缓存是要付费的","stability":"development","briefZh":"写入提供方管理的缓存的输入 token 数量。","noteZh":"Anthropic 把这个值与 `input_tokens` 分开上报。计算 `gen_ai.usage.input_tokens` 时，必须把它加到 Anthropic 的 `input_tokens` 上。","reqZh":"推荐 · 适用时","reqFrom":"gen_ai.inference.client"}]},{"ns":"gen-ai","type":"aws.bedrock.inference.client","kind":"refinement","baseKind":"client","refines":"gen_ai.inference.c l. A [guardrail](https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html) helps safeguard and prevent unwanted behavior from model responses or user messages.\n","note":"","why":"","stability":"development","briefZh":"AWS Bedrock 护栏的唯一标识符；护栏用于防护并阻止模型响应或用户消息中的不良行为。","noteZh":"","reqZh":"必填","reqFrom":""},{"key":"aws.bedrock.knowledge_base.id","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["XFWUPB9PAW"],"req":"推荐","reqCat":"recommended","brief":"The unique identifier of the AWS Bedrock Knowledge base. A [knowledge base](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html) is a bank of information that can be queried by models to generate more relevant responses and augment prompts.\n","note":"","why":"","stability":"development","briefZh":"AWS Bedrock 知识库的唯一标识符；知识库是可被模型查询、用于生成更相关响应并增强提示词的信息库。","noteZh":"","reqZh":"推荐","reqFrom":""}]}],"metrics":[{"ns":"gen-ai","name":"gen_ai.client.operation.duration","instrument":"histogram","unit":"s","brief":"GenAI operation duration.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.operation.time_to_first_chunk","instrument":"histogram","unit":"s","brief":"Time to receive the first chunk, measured from when the client issues the generation request to when the first chunk is received in the response stream.","note":"This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.operation.time_per_output_chunk","instrument":"histogram","unit":"s","brief":"Time per output chunk, recorded for each chunk received after the first one, measured as the time elapsed from the end of the previous chunk to the end of the current chunk.","note":"This metrics SHOULD be reported for streaming calls and SHOULD NOT be reported otherwise.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.server.request.duration","instrument":"histogram","unit":"s","brief":"Generative AI server request duration such as time-to-last byte or last output token.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.server.time_per_output_token","instrument":"histogram","unit":"s","brief":"Time per output token generated after the first token for successful responses.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.server.time_to_first_token","instrument":"histogram","unit":"s","brief":"Time to generate first token for successful responses.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.invoke_workflow.duration","instrument":"histogram","unit":"s","brief":"Records duration of GenAI workflow.","note":"Represents the end-to-end duration of a workflow execution, measured from the point where application code initiates the workflow to the point where the workflow completes, independent of workflow complexity. A workflow is a coordinated process composed of multiple agents or other operations involving generative AI. If instrumentation measures only a single provider-facing client operation (for example, one model API call), `gen_ai.client.operation.duration` SHOULD be used instead. Instrumentation MAY emit both metrics for the same request path when both boundaries are available. When this metric is reported alongside a `gen_ai.invoke_workflow.internal` span, the metric value SHOULD be the same as the span duration. Individual systems may include additional system-specific attributes. Refer to system-specific documentation, if available.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.invoke_agent.duration","instrument":"histogram","unit":"s","brief":"The end-to-end duration of a single in-process agent invocation, from the moment the invocation starts until the agent emits the last chunk of its final response or terminates with an error.","note":"Intended for instrumentations of agent frameworks (for example, ADK, LangChain agents, CrewAI agents) that can reliably bound a single agent invocation. If instrumentation can only measure a single provider-facing client operation (for example, one model API call), `gen_ai.client.operation.duration` SHOULD be used instead. If instrumentation can reliably bound a higher-level workflow that coordinates multiple agents, `gen_ai.invoke_workflow.duration` SHOULD be used for that workflow. Instrumentation MAY emit several of these metrics for the same request path when more than one boundary is available. When this metric is reported alongside a `gen_ai.invoke_agent.internal` span, the metric value SHOULD be the same as the span duration.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.invoke_agent.inference_calls","instrument":"histogram","unit":"{inference_call}","brief":"The number of inference (model) calls a GenAI agent makes during a single invocation.","note":"The distribution is scoped to a single agent invocation and SHOULD include only the inference calls the agent itself issued including failed ones; calls made by sub-agents or transferred-to agents are recorded against those agents' own invocations so that each inference call is counted exactly once across the call tree. This metric SHOULD be emitted together with the `gen_ai.invoke_agent.internal` span for the same invocation.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.invoke_agent.tool_calls","instrument":"histogram","unit":"{tool_call}","brief":"The number of tool calls a GenAI agent makes during a single invocation.","note":"The distribution is scoped to a single agent invocation and SHOULD include only the tool calls the agent itself triggers including failed ones; calls made by sub-agents or transferred-to agents are recorded against those agents' own invocations so that each tool call is counted exactly once across the call tree. Only client-side tool calls (tools executed by the agent or framework) are counted. Tools executed server-side by the model provider (for example, provider built-in web search or code execution) are not counted here. This metric SHOULD be emitted together with the `gen_ai.invoke_agent.internal` span for the same invocation.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.execute_tool.duration","instrument":"histogram","unit":"s","brief":"The duration of a single tool execution.","note":"Instrumentation that can reliably bound a single tool call SHOULD record this metric for every tool execution they can observe. When this metric is reported alongside a `gen_ai.execute_tool` span, the metric value SHOULD be the same as the span duration.","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.usage.input_tokens","instrument":"counter","unit":"{token}","brief":"The number of input (prompt) tokens used, including cached tokens.","note":"This metric SHOULD be reported when an operation involves the usage of tokens and the count is readily available. When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.usage.output_tokens","instrument":"counter","unit":"{token}","brief":"The number of output (completion) tokens used, including reasoning tokens.","note":"This metric SHOULD be reported when an operation involves the usage of tokens and the count is readily available. When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.usage.cache_read.input_tokens","instrument":"counter","unit":"{token}","brief":"The number of input tokens served from a provider-managed cache.","note":"This value is a subset of `gen_ai.client.inference.usage.input_tokens`.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.usage.cache_write.input_tokens","instrument":"counter","unit":"{token}","brief":"The number of input tokens written to a provider-managed cache.","note":"This value is a subset of `gen_ai.client.inference.usage.input_tokens`.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.usage.reasoning.output_tokens","instrument":"counter","unit":"{token}","brief":"The number of output tokens used for reasoning (e.g. chain-of-thought, extended thinking).","note":"This value is a subset of `gen_ai.client.inference.usage.output_tokens`.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.operation.input_tokens","instrument":"histogram","unit":"{token}","brief":"The number of input (prompt) tokens used per inference operation.","note":"This metric SHOULD be reported when an operation involves the usage of tokens and the count is readily available. For example, if GenAI system returns usage information in the streaming response, it SHOULD be used. Or if GenAI system returns each token independently, instrumentation SHOULD count number of output tokens and record the result. If instrumentation cannot efficiently obtain number of input and/or output tokens, it MAY allow users to enable offline token counting. Otherwise it MUST NOT report usage metrics. When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"gen-ai","name":"gen_ai.client.inference.operation.output_tokens","instrument":"histogram","unit":"{token}","brief":"The number of output (completion) tokens used per inference operation.","note":"This metric SHOULD be reported when an operation involves the usage of tokens and the count is readily available. For example, if GenAI system returns usage information in the streaming response, it SHOULD be used. Or if GenAI system returns each token independently, instrumentation SHOULD count number of output tokens and record the result. If instrumentation cannot efficiently obtain number of input and/or output tokens, it MAY allow users to enable offline token counting. Otherwise it MUST NOT report usage metrics. When systems report both used tokens and billable tokens, instrumentation MUST report billable tokens.","req":"推荐","reqCat":"recommended","stability":"development","file":"token-metrics.yaml"},{"ns":"mcp","name":"mcp.client.operation.duration","instrument":"histogram","unit":"s","brief":"The duration of the MCP request or notification as observed on the sender from the time it was sent until the response or ack is received.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"mcp","name":"mcp.server.operation.duration","instrument":"histogram","unit":"s","brief":"MCP request or notification duration as observed on the receiver from the time it was received until the result or ack is sent.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"mcp","name":"mcp.client.session.duration","instrument":"histogram","unit":"s","brief":"The duration of the MCP session as observed on the MCP client.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"},{"ns":"mcp","name":"mcp.server.session.duration","instrument":"histogram","unit":"s","brief":"The duration of the MCP session as observed on the MCP server.","note":"","req":"推荐","reqCat":"recommended","stability":"development","file":"metrics.yaml"}],"events":[{"ns":"gen-ai","name":"gen_ai.client.inference.operation.details","brief":"Describes the details of a GenAI completion request including chat history and parameters.","stability":"development","fields":[{"key":"gen_ai.request.model","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["gpt-4"],"req":"条件必填 · If available.","reqCat":"conditional","brief":"The name of the GenAI model a request is being made to.","note":"The name of the GenAI model a request is being made to. If the model is supplied by a vendor, then the value must be the exact name of the model requested. If the model is a fine-tuned custom model, the value should have a more specific name than the base model that's been fine-tuned.","why":"请求侧模型名，用于对比「要的」与「实际用的」","stability":"development","briefZh":"请求所调用的 GenAI 模型名称。","noteZh":"请求所调用的 GenAI 模型名称。若模型由厂商提供，取值必须是所请求模型的准确名称；若是微调的自定义模型，应使用比被微调的基础模型更具体的名称。","reqZh":"条件必填 · 若可得","reqFrom":""},{"key":"gen_ai.operation.name","type":"string","typeAlt":"enum","typeEnumCount":18,"values":["chat","generate_content","text_completion","embeddings","retrieval","fetch_response","create_agent","invoke_agent","execute_tool","invoke_workflow","plan","search_memory","create_memory","update_memory","upsert_memory","delete_memory","create_memory_store","delete_memory_store"],"valueBriefs":{"chat":"Chat completion operation such as [OpenAI Chat API](https://platform.openai.com/docs/api-reference/chat)","generate_content":"Multimodal content generation operation such as [Gemini Generate Content](https://ai.google.dev/api/generate-content)","text_completion":"Te cute_tool":"执行工具","invoke_workflow":"调用 GenAI 工作流","plan":"Agent 规划或任务分解阶段","search_memory":"从记忆存储中搜索 / 查询记忆","create_memory":"创建新的记忆记录","update_memory":"更新已有记忆记录","upsert_memory":"创建或更新记忆记录（由实现决定是创建还是更新，调用方不指定）","delete_memory":"删除记忆记录","create_memory_store":"创建或初始化记忆存储","delete_memory_store":"删除或下线记忆存储"},"examples":null,"req":"必填","reqCat":"required","brief":"The name of the operation being performed.","note":"If one of the predefined values applies, but specific system uses a different name it's RECOMMENDED to document it in the semantic conventions for specific GenAI system and use system-specific name in the instrumentation. If a different name is not documented, instrumentation libraries SHOULD use applicable predefined value.","why":"决定 span 名与后端聚合口径，是规范里唯一的操作类型枚举","stability":"development","briefZh":"正在执行的操作名称。","noteZh":"若适用某个预定义取值，但特定系统使用了不同名称，推荐在特定 GenAI 系统的语义约定中记录该名称，并在埋点库中使用系统特定名称。若未记录不同的名称，埋点库宜使用适用的预定义取值。","reqZh":"必填","reqFrom":"","valuesApplicable":["chat","generate_content","text_completion"],"valuesScopeKind":"example"},{"key":"server.address","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["example.com","10.1.2.80","/tmp/my.sock"],"req":"推荐","reqCat":"recommended","brief":"GenAI server address.","note":"When observed from the client side, and when communicating through an intermediary, `server.address` SHOULD represent the server address behind any intermediaries, for example proxies, if it's available.","why":"来自核心语义约定，非 gen_ai 专有","stability":"stable","briefZh":"GenAI 服务器地址。","noteZh":"从客户端侧观测、且经过中间层通信时，`server.address` 宜表示中间层（如代理）背后的服务端地址（若可得）。","reqZh":"推荐","reqFrom":""},{"key":"server.port","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["80","8080","443"],"req":"条件必填 · If `server.address` is set.","reqCat":"conditional","brief":"GenAI server port.","note":"When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent the server port behind any intermediaries, for example proxies, if it's available.","why":"来自核心语义约定，非 gen_ai 专有","stability":"stable","briefZh":"GenAI 服务器端口。","noteZh":"从客户端侧观测、且经过中间层通信时，`server.port` 宜表示中间层（如代理）背后的服务端端口（若可得）。","reqZh":"条件必填 · 若设置了 server.address","reqFrom":""},{"key":"gen_ai.usage.input_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The number of tokens used in the GenAI input (prompt).","note":"This value SHOULD include all types of input tokens, including cached tokens. Instrumentations SHOULD make a best effort to populate this value, using a total provided by the provider when available or, depending on the provider API, by summing different token types parsed from the provider output. When the provider reports both billed token counts and model-consumed token counts (for example, Cohere exposes both `usage.billed_units` and `usage.tokens`), instrumentations SHOULD report the billed count so the value matches the units the customer is charged for. Detailed usage attributes are subsets of total and aggregate counts. For example, if a request has 100 text tokens (40 cached) and 200 image tokens: - `gen_ai.usage.input_tokens`: 300 - `gen_ai.usage.cache_read.input_tokens`: 40 - `gen_ai.usage.text.input_tokens`: 100 - `gen_ai.usage.text.cache_read.input_tokens`: 40 - `gen_ai.usage.image.input_tokens`: 200","why":"含缓存 token 的输入总量；厂商同时报计费量与实际消耗时填计费量","stability":"development","briefZh":"GenAI 输入（提示词）消耗的 token 数量。","noteZh":"该值宜包含所有类型的输入 token，含缓存 token。埋点库宜尽力填充：提供方给出总量时用该总量，或按提供方 API 对不同类型求和。当提供方同时报告计费数与模型消耗数时（如 Cohere 的 usage.billed_units 与 usage.tokens），宜报告计费数，以匹配客户计费单位。明细用量属性是总量与聚合计数的子集。例如请求含 100 个文本 token（40 个缓存）和 200 个图像 token 时，gen_ai.usage.* 各属性取值为：input_tokens=300，cache_read.input_tokens=40，text.input_tokens=100，text.cache_read.input_tokens=40，image.input_tokens=200。","reqZh":" "typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"user\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"Weather in Paris?\"\n      }\n    ]\n  },\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"name\": \"get_weather\",\n        \"arguments\": {\n          \"location\": \"Paris\"\n        }\n      }\n    ]\n  },\n  {\n    \"role\": \"tool\",\n    \"parts\": [\n      {\n        \"type\": \"tool_call_response\",\n        \"id\": \"call_VSPygqKTWdrhaFErNvMV18Yl\",\n        \"response\": \"rainy, 57°F\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"The chat history provided to the model as an input.\n","note":"Messages MUST be provided in the order they were sent to the model. Instrumentations MAY provide a way for users to filter or truncate input messages. > [!Warning] > This attribute is likely to contain sensitive information including user/PII data. See [Recording content on attributes](/docs/gen-ai/gen-ai-spans.md#recording-content-on-attributes) section for more details.","why":"按规范内容 schema 序列化，角色与 parts 结构固定，后端才能渲染成对话","stability":"development","briefZh":"作为输入提供给模型的聊天历史。","noteZh":"消息必须按发送给模型的顺序提供。埋点库可以提供让用户过滤或截断输入消息的方式。注意：该属性很可能包含敏感信息，包括用户/个人身份信息。详见 gen-ai-spans.md 中记录内容到属性的章节。","reqZh":"需显式开启","reqFrom":""},{"key":"gen_ai.output.messages","type":"any","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["[\n  {\n    \"role\": \"assistant\",\n    \"parts\": [\n      {\n        \"type\": \"text\",\n        \"content\": \"The weather in Paris is currently rainy with a temperature of 57°F.\"\n      }\n    ]\n  }\n]\n"],"req":"需显式开启","reqCat":"optin","brief":"Messages returned by the model where each message represents a specific model response (choice, candidate).","note":"Each message repr itive information. Since this attribute could be large, it's NOT RECOMMENDED to populate non-required properties by default. Instrumentations MAY provide a way to enable populating optional properties.","why":"","stability":"development","briefZh":"GenAI Agent 或模型可用的工具定义列表。","noteZh":"注意：该属性可能包含敏感信息。由于该属性可能很大，不建议默认填充非必需属性。埋点库可以提供开启可选属性填充的方式。","reqZh":"需显式开启","reqFrom":""},{"key":"error.type","type":"string","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["timeout","java.net.UnknownHostException","server_certificate_invalid","500"],"req":"条件必填 · If the operation ended in an error.","reqCat":"conditional","brief":"Describes a class of error the operation ended with.","note":"The `error.type` SHOULD match the error code returned by the Generative AI provider or the client library, the canonical name of exception that occurred, or another low-cardinality error identifier. Instrumentations SHOULD document the list of errors they report.","why":"","stability":"stable","briefZh":"描述操作结束时所归类的错误类型。","noteZh":"`error.type` 宜与生成式 AI 提供方或客户端库返回的错误码、所抛异常的规范名称，或其它低基数错误标识一致。埋点库宜记录自己会上报哪些错误。","reqZh":"条件必填 · 若该操作以错误结束","reqFrom":""},{"key":"gen_ai.request.max_tokens","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["100"],"req":"推荐","reqCat":"recommended","brief":"The maximum number of tokens the model generates for a request.","note":"","why":"上限，配合 finish_reasons 判断截断原因","stability":"development","briefZh":"模型针对一次请求生成的最大 token 数量。","noteZh":"","reqZh":"推荐","reqFrom":""},{"key":"gen_ai.request.choice.count","type":"int","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["3"],"req":"条件必填 · If available, in the request, and !=1.","reqCat":"conditional","brief":"The target number of candidate completions to return.","note":"","why":"n>1 时才有，决定响应条数","stability":"development","briefZh":"期望返回的候选补全数量。","noteZh":"","reqZh":"条件必填 · 若可得、在请求中且不 ory/RunnableWithMessageHistory), and [Google ADK sessions](https://adk.dev/sessions/session)) - when instrumenting GenAI client libraries that maintain a conversation on the backend (see [AWS Bedrock agent sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html), [OpenAI Assistant threads](https://platform.openai.com/docs/api-reference/threads)) When no identifier for the conversation is available, instrumentations SHOULD NOT populate conversation id. For example, a new UUID, a trace identifier, or a hash of request content SHOULD NOT be used as a fallback value. Application developers that manage conversation history MAY add conversation id to GenAI and other spans or logs using custom span or log record processors or hooks provided by instrumentation libraries.","why":"多轮会话关联；仅当库自身持有会话概念时才有","stability":"development","briefZh":"会话（session、thread）的唯一标识符，用于在该会话内存储和关联消息。","noteZh":"当某次操作可方便获得会话标识符时，埋点库宜填充会话 id，例如：被埋点的客户端框架管理会话历史时（如 LlamaIndex、LangChain、Google ADK 的会话存储），或埋点于在后端维护会话的 GenAI 客户端库时（如 AWS Bedrock、OpenAI Assistant）。没有可用标识符时，埋点库不应填充会话 id；不得用新 UUID、trace 标识符或请求内容哈希作回退值。应用开发者可借助埋点库的自定义 span/日志处理器或钩子，把会话 id 加入 GenAI 及其他 span 或日志。","reqZh":"条件必填 · 当且仅当被埋点的库可方便地获得该值，或用户应用通过 OpenTelemetry 上下文或库特定机制提供该值","reqFrom":""},{"key":"gen_ai.conversation.compacted","type":"boolean","typeAlt":"","typeEnumCount":0,"values":null,"valueBriefs":null,"valueBriefsZh":{},"examples":["True"],"req":"推荐 · when available","reqCat":"recommended","brief":"Indicates whether the effective conversation context used for this operation is a compacted view of a prior conversation.","note":"This attribute is a positive indicator of context compaction. Instrumentations SHOULD set it to `true` only when they can reliably determine that context compaction was applied. Instrumentations SHOULD NOT set it to `false`; they SHOULD leave it unset otherwise.","why":"","stability":"development","briefZh":"指示本次操作使用的有效会话上下文是否为先前会话的压缩视图。","noteZh":"该属性是上下文压缩的肯定性指示。仅当能可靠判定已应用
