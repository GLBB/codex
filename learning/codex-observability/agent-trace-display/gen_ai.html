<script>
/* ============================ 工具 ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// 规范正文里的行内 markdown（`code`、[文字](链接)、**粗体**）转成安全 HTML。
// 先转义再替换，链接只允许 http(s)，避免把 YAML 里的内容当代码执行。
const mdInline = (s) => esc(s)
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
// 分组顺序取自数据：extract.py 按规范文档的章节顺序排好，这里不再另写一份
const GROUP_ORDER = [...new Set(SPEC.spans.map((x) => x.group))];
const REQ_ORDER = ["required", "conditional", "recommended", "other", "optin", "inherit"];
const REQ_LABEL = { required: "必填", conditional: "条件必填", recommended: "推荐", optin: "需显式开启", other: "其他", inherit: "继承核心约定" };

/* ---------- 主题 ---------- */
// 颜色一律从 CSS 变量取，切换主题时重新读取，避免 JS 里写死两套色
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let C = {};
function loadThemeColors() {
  C = {
    bg: cssVar("--bg"),
    noFill: "none",
    grid: cssVar("--line"),
    zone: cssVar("--line-2"),
    connector: cssVar("--line-2"),
    tick: cssVar("--fg-3"),
    tickEnd: cssVar("--fg-2"),
    dur: cssVar("--fg-2"),
    rowSel: cssVar("--panel-2"),
    scope: cssVar("--scope"),
    owner: cssVar("--fg-3"),
    ok: cssVar("--ok"),
    warn: cssVar("--warn"),
    err: cssVar("--err"),
    accent: cssVar("--accent"),
    groups: {
      "Model spans": cssVar("--accent"),
      "Agent spans": cssVar("--prov"),
      "MCP": cssVar("--mcp"),
      "provider 特化": cssVar("--fg-2"),
    },
    // 与分组无关的配色槽：指标图、链路分区标签等按「像哪一类东西」取色
    tone: {
      model: cssVar("--accent"),
      agent: cssVar("--prov"),
      tool: cssVar("--warn"),
      mcp: cssVar("--mcp"),
      prov: cssVar("--fg-2"),
    },
  };
}
// 所有示例链路都是规范形态，span 一律带规范 type。这里只做兜底，
// 万一有 span 没写 type，也不要让瀑布图整条崩掉。
const kindOf = (sp) => sp.type || "gen_ai.invoke_agent.internal";

// 瀑布图着色：与 Span 定义页的分组同源（都从 SPEC.spans 的 group 字段取），
// 避免同一 span 在两个 Tab 里属于不同类别——那正是旧版 KIND_TONE 的问题。
const GROUP_OF = Object.fromEntries(SPEC.spans.map((x) => [x.type, x.group]));
const KIND_TONE = (type) => C.groups[GROUP_OF[type]] || C.tone.model;

// 两类来源合到一条平铺的链路行里：改写自实采的排在前面（它们更有信息量）。
// 两边都是规范形态，读法完全一致。
window.TRACES = [].concat(window.TRACES_CAPTURED || [], window.TRACES || []);

const spansByType = Object.fromEntries(SPEC.spans.map((s) => [s.type, s]));
const gapsById = Object.fromEntries((SPEC.gaps || []).map((g) => [g.id, g]));
const metricByName = Object.fromEntries(SPEC.metrics.map((m) => [m.name, m]));

/* ============================ Tab 骨架 ============================ */
const TABS = [
  { id: "overview", label: "概览", n: "" },
  { id: "traces", label: "Trace 示例", n: window.TRACES.length },
  { id: "spans", label: "Span 定义", n: SPEC.spans.length },
  { id: "metrics", label: "指标", n: SPEC.metrics.length },
  { id: "events", label: "事件", n: SPEC.events.length },
];
function buildTabs() {
  const nav = $("#tabs");
  TABS.forEach((t) => {
    const b = el("button", { class: t.id === "overview" ? "on" : "", "data-tab": t.id });
    b.append(document.createTextNode(t.label));
    if (t.n !== "") b.append(el("span", { class: "n", text: t.n }));
    b.addEventListener("click", () => {
      $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
      $$("main section").forEach((s) => s.classList.toggle("on", s.id === "tab-" + t.id));
      window.scrollTo({ top: 0, behavior: "instant" });
    });
    nav.append(b);
  });
}
function goTab(id) {
  const b = $$("#tabs button").find((x) => x.dataset.tab === id);
  if (b) b.click();
}

/* ============================ Tab1 概览 ============================ */
function renderOverview() {
  const s = $("#tab-overview");
  const totalSpanFields = SPEC.spans.reduce((a, x) => a + x.attrs.length, 0);

  // 覆盖统计（来自仓库 reference/scenarios/*/data.json 的实测汇总）
  const statRow = el("div", { class: "stat-row" });
  [
    ["18", "span 类型", "gen-ai 11 · provider 特化 5 · MCP 2"],
    ["22", "指标", "gen_ai 18（histogram 13 / counter 5）· MCP 4"],
    ["3", "事件", "其中 1 个整组复用 span 字段"],
    ["89", "span 引用的属性", "本地 model/ 共定义 82 个（gen-ai 72 · MCP 4 · openai 4 · bedrock 2），其中 77 个被 span 表引用；另外 12 个来自核心约定依赖：error.type · server.* · client.* · network.* · jsonrpc.* · rpc.* · azure.*"],
    ["8", "内容 schema", "消息 / 工具 / 检索文档的结构定义"],
    ["6 / 13 / 25", "场景发过 指标 / 事件 / span", "共 28 个参考场景"],
  ].forEach(([v, l, d]) => {
    statRow.append(el("div", { class: "stat" }, [
      el("div", { class: "v", text: v }),
      el("div", { class: "l", text: l }),
      el("div", { class: "d", text: d }),
    ]));
  });
  s.append(statRow);

  s.append(el("div", { class: "grid g2", style: "margin-top:16px" }, [
    el("div", { class: "note warn" }, [
      el("span", { class: "lbl", text: "最容易被误解的一点" }),
      el("div", {
        html: "规范<strong>不定义一条完整的 Agent trace</strong>，它定义的是每个库该发自己哪一部分。" +
          "看 Trace 示例这一页：一次 CrewAI 运行里，workflow / plan / invoke_agent / execute_tool 归框架，两次模型调用归底层客户端库——" +
          "它们是<strong>两套插桩</strong>发出来的，靠上下文传播拼成一条 trace。",
      }),
    ]),
    el("div", { class: "note" }, [
      el("span", { class: "lbl", text: "所以判断归属的规则是" }),
      el("div", {
        html: "库把模型调用委托给另一个可插桩的库，就<strong>不许</strong>自己发 inference；" +
          "库自己执行工具，才<strong>可以</strong>发 execute_tool。" +
          "这条规则写在 <code>reference/AGENTS.md</code>，是每个新场景必须过的测试。",
      }),
    ]),
  ]));

  // 信号覆盖：span 几乎人人都有，指标和事件少得多
  s.append(el("div", { class: "note", style: "margin-top:16px" }, [
    el("span", { class: "lbl", text: "三类信号的实际覆盖差很多" }),
    el("div", {
      html: "仓库 28 个参考场景里，<strong>25 个发出 span，6 个发指标，13 个发事件</strong>" +
        "（发指标或事件的合计 15 个，两者有重叠）。" +
        "所以「规范定义了」和「插桩发了」是两件事——指标页里我逐个标注了哪些库真的发过。",
    }),
  ]));

  // 示例覆盖：哪些 span 类型被 trace 示例演示过。光看示例条数会误以为覆盖很全。
  const cov = SPEC.traceCoverage;
  if (cov) {
    const covered = new Set(cov.covered);
    const spec = cov.specialized || [];
    // 没出现在示例里的基类（规范给它写了 provider 特化）与真的没例子的类型，分开说
    const missBase = spec.filter((b) => !b.covered);
    const missOther = cov.other || [];
    const code = (x) => `<code>${esc(x)}</code>`;
    const bits = [`${SPEC.spans.length} 类 span 里，<strong>${covered.size} 类</strong>在 Trace 示例页有实例。`];
    if (missBase.length) {
      bits.push(`${missBase.map((b) => code(b.type)).join("、")} 只在 provider 特化形态下出现：`
        + missBase.map((b) => b.specializedBy.map(code).join(" / ")).join("、")
        + `。规范也允许没有特化的 provider 直接发基类 + ${code("gen_ai.provider.name")}，本页没造这种例子。`);
    }
    if (missOther.length) {
      bits.push(`另有 ${missOther.length} 类没有例子：${missOther.map(code).join("、")}。`);
    }
    if (spec.length) {
      bits.push(`带 provider 特化的基类共 ${spec.length} 个：`
        + spec.map((b) => `${code(b.type)} → ${b.specializedBy.map(code).join(" / ")}`).join("；")
        + `。同一个操作因此会有好几个 span 类型——有特化的 provider 按特化那张字段表走，`
        + `没有特化的直接发基类，这是规范的抽象方式，不是重复定义。`);
    }
    s.append(el("div", { class: "note", style: "margin-top:16px" }, [
      el("span", { class: "lbl", text: "Trace 示例的 span 覆盖" }),
      el("div", { html: bits.join(" ") }),
    ]));
  }

  // 按操作族分组（分组只为本页阅读方便，规范按文档与 span kind 组织）
  const layers = {};
  SPEC.spans.forEach((x) => { (layers[x.group] ||= []).push(x); });
  const order = GROUP_ORDER;
  const wrap = el("div", { class: "grid g3", style: "margin-top:16px" });
  order.filter((k) => layers[k]).forEach((k) => {
    const box = el("div", { class: "layer" });
    box.append(el("div", { class: "layer-h" }, [
      el("i", { class: "dot", style: `background:${C.groups[k]}` }),
      el("b", { text: k }),
      el("span", { text: (layers[k][0].groupFile || "") + " · " + layers[k].length + " 个 span" }),
    ]));
    layers[k].forEach((sp) => {
      const it = el("div", { class: "sp-item", title: "查看字段定义" }, [
        el("span", { class: "nm", text: sp.type.replace(/^gen_ai\./, "") }),
        el("span", { class: "ct", text: sp.kind + " · " + sp.attrs.length + " 字段" }),
      ]);
      it.addEventListener("click", () => { goTab("spans"); selectSpan(sp.type); });
      box.append(it);
    });
    wrap.append(box);
  });
  s.append(wrap);
}

/* ============================ Tab2 Trace ============================ */
// 默认选中第一条 trace。必须与下面渲染用的是同一个数据源，
// 否则会出现「状态指向示意 trace、瀑布图却画了真实 trace」的错位。
let curTrace = (window.TRACES[0] || {}).id;
let curSpan = null;

function renderTraceTabs() {
  // 不区分「真实/示意」——都按链路展示，读法一致
  const bar = el("div", { class: "trace-bar" }, [el("span", { class: "lab", text: "链路" })]);
  window.TRACES.forEach((t) => {
    const b = el("button", { class: "tbtn" + (t.id === curTrace ? " on" : ""), text: t.tab, title: t.title });
    b.addEventListener("click", () => { curTrace = t.id; curSpan = null; renderTraces(); });
    bar.append(b);
  });
  return bar;
}

function renderTraces() {
  const s = $("#tab-traces");
  s.textContent = "";
  const t = window.TRACES.find((x) => x.id === curTrace);
  s.append(renderTraceTabs());

  // 工具条：只放运行态信息。解释性文字一律收进 title 悬停，
  // 因为 Span 定义页已经承担了「讲清规范」的职责，这里要像观测后台。
  const maxDepth = Math.max(...t.spans.map((sp) => sp.depth)) + 1;
  const owners = new Set(t.spans.map((sp) => sp.owner)).size;
  const errs = t.spans.filter((sp) => sp.error).length;
  const isSynth = String(t.scenario).includes("综合");

  const bar = el("div", { class: "opbar" });
  const left = el("div", { class: "opbar-l" });
  left.append(el("span", { class: "op-t", text: t.title, title: t.note }));
  // 两类示例都是规范形态，形状上不分彼此；这里只交代数值的来路。
  if (t.captured) left.append(el("span", { class: "flag ok", title: "时序、token 数、轮次取自 o11y 抓到的线上 span，只做了规范化改写，没有编造数值", text: "数值实测" }));
  bar.append(left);

  const metrics = el("div", { class: "opbar-r" });
  [
    ["span", t.spans.length, "共 " + t.spans.length + " 条 span"],
    ["深度", maxDepth, "最大嵌套 " + maxDepth + " 层"],
    ["来源", owners, "由 " + owners + " 个不同的库/组件插桩"],
    ["全长", fmt(t.duration), "端到端耗时 " + fmt(t.duration)],
  ].forEach(([k, v, tip]) => {
    metrics.append(el("div", { class: "m", title: tip }, [
      el("span", { class: "k", text: k }),
      el("span", { class: "v", text: String(v) }),
    ]));
  });
  if (errs) {
    metrics.append(el("div", { class: "m bad", title: errs + " 条 span 带 error 状态" }, [
      el("span", { class: "k", text: "失败" }), el("span", { class: "v", text: String(errs) }),
    ]));
  }
  bar.append(metrics);

  const meta = el("div", { class: "opmeta" });
  meta.append(el("span", { class: "src", text: t.lib, title: t.scenario }));
  (t.tech || []).forEach(([k, v]) => {
    meta.append(el("span", { class: "kv", title: k + "：" + v }, [
      el("i", { text: k }), document.createTextNode(v),
    ]));
  });
  if (isSynth) {
    meta.append(el("span", { class: "kv warn",
      title: "这条 trace 的形态综合自仓库 crewai / google-adk / openai-agents 三类场景；span 数量、时序与 token 数为示意，不是抓包实测。字段名与操作类型均按规范。",
      text: "形态示意，非实测" }));
  }
  s.append(bar);
  s.append(meta);

  const svg = renderWaterfall(t);
  const panel = el("div", { class: "panel", id: "detail" });
  const scroller = el("div", { class: "wf-scroll" }, [svg]);
  s.append(el("div", { class: "wrap" }, [scroller, panel]));

  // 图例按「操作族 → 颜色」列，只列这条链路里实际出现的分组，与 Span 定义页同源
  const lg = el("div", { class: "legendrow" });
  const seenGroups = [...new Set(t.spans.map((sp) => GROUP_OF[sp.type]).filter(Boolean))]
    .sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
  seenGroups.forEach((g) => {
    const types = [...new Set(t.spans.filter((sp) => GROUP_OF[sp.type] === g)
      .map((sp) => sp.type.replace(/^gen_ai\./, "").replace(/^mcp\./, "")))];
    lg.append(el("span", { title: "本链路里的 " + types.join(" / "), html: `<i style="background:${C.groups[g]}"></i>${g}` }));
  });
  s.append(lg);
  s.append(el("div", { class: "hint", style: "margin-top:6px", text: "点任意一行看该 span 的完整字段。顶部虚线表示这段 trace 是谁的插桩发出来的。" }));

  renderDetail();
}

/* ---- 瀑布图：手写 SVG ---- */
function renderWaterfall(t) {
  // 深 trace 用更宽的画布 + 横向滚动，避免把几十条 span 压扁到不可读
  const W = 1560, ROW = 34, PAD_T = 56, PAD_B = 28;
  const H = PAD_T + t.spans.length * ROW + PAD_B;

  // 名称列宽按最长标签收缩，其余留给时间轴。
  // 注意：CJK 是全宽字符，按 6.9px/字符估算会明显偏小，分级估算。
  const textW = (s) => {
    let w = 0;
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      w += c > 0x2e80 ? 13.4 : 7.8;      // CJK / 全角 vs 半角（13px 等宽）
    }
    return w;
  };
  const maxLab = Math.max(...t.spans.map((sp) => sp.depth * 16 + textW(sp.label) + (sp.delegated ? 48 : 0)));
  const COL = Math.max(260, Math.min(560, Math.ceil(maxLab) + 24));
  const T0 = COL + 8, T1 = W - 58, TW = T1 - T0;
  const x = (ms) => T0 + (ms / Math.max(t.duration, 1)) * TW;
  // 标签不会自动换行，超出列宽的按字符截断（完整名称仍可在详情面板看到）
  const fitLabel = (s, budget) => {
    if (textW(s) <= budget) return s;
    let out = "";
    for (const ch of String(s)) {
      if (textW(out + ch) > budget - 10) return out + "…";
      out += ch;
    }
    return out;
  };

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "waterfall");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
  // 窄屏不缩到读不清；留出滚动条余量，避免最小宽度反向把页面撑宽
  svg.style.minWidth = Math.round(W * 0.7) + "px";
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", t.title + " 的 span 瀑布图");
  const add = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    svg.append(n);
    return n;
  };

  // 失败 span 的斜纹底（pattern 只能挂在 defs 里）
  const defs = document.createElementNS(NS, "defs");
  const hatch = document.createElementNS(NS, "pattern");
  hatch.setAttribute("id", "errHatch");
  hatch.setAttribute("width", "6"); hatch.setAttribute("height", "6");
  hatch.setAttribute("patternUnits", "userSpaceOnUse");
  hatch.setAttribute("patternTransform", "rotate(45)");
  const hl = document.createElementNS(NS, "line");
  hl.setAttribute("x1", "0"); hl.setAttribute("y1", "0"); hl.setAttribute("x2", "0"); hl.setAttribute("y2", "6");
  hl.setAttribute("stroke", C.bg); hl.setAttribute("stroke-width", "2"); hl.setAttribute("opacity", "0.35");
  hatch.append(hl); defs.append(hatch); svg.append(defs);

  // 区域（谁发的）—— 分区标注再上移一行，避免与刻度文字挤在一起
  // 只有一个分区时整条 trace 同源，顶部标签是冗余信息，省掉
  const multiZone = t.zones.length > 1;
  t.zones.forEach((z) => {
    if (z.from > 0) add("line", { class: "zone", x1: x(z.from), y1: PAD_T - 20, x2: x(z.from), y2: H - PAD_B + 4 });
    if (multiZone) add("text", { x: x(z.from) + 6, y: PAD_T - 24, class: "own", fill: z.tone === "client" ? C.tone.model : C.tone.agent }, z.label);
  });

  // 刻度：夹到 [0, duration]，避免极小 duration 下按 duration+1 画出边界外的线
  const step = niceStep(t.duration);
  if (t.duration > 0) {
    for (let ms = 0; ms <= t.duration; ms += step) {
      add("line", { class: "grid", x1: x(ms), y1: PAD_T - 6, x2: x(ms), y2: H - PAD_B + 4 });
      if (ms < t.duration) add("text", { x: x(ms) + 3, y: PAD_T - 10, fill: C.tick }, fmt(ms));
    }
  }
  // 终点单独标注：步长未必整除总时长，否则右端没有参照。
  // 但与最后一个常规刻度太近时（标签会叠在一起）就跳过——重叠比缺一个刻度更糟。
  add("line", { class: "grid", x1: x(t.duration), y1: PAD_T - 6, x2: x(t.duration), y2: H - PAD_B + 4 });
  const endLabel = fmt(t.duration);
  const endW = textW(endLabel);
  const lastTickX = t.duration > 0 ? x(Math.floor(t.duration / step) * step) : -1e9;
  const endLeft = x(t.duration) - endW;                 // 终点标签右对齐，占 [endLeft, x(duration)]
  const lastRight = lastTickX + textW(fmt(Math.floor(t.duration / step) * step)) + 3;
  if (endLeft - lastRight > 8) {
    add("text", { x: x(t.duration), y: PAD_T - 10, fill: C.tickEnd, "text-anchor": "end" }, endLabel);
  }

  // 行
  t.spans.forEach((sp, i) => {
    const y = PAD_T + i * ROW;
    const cy = y + ROW / 2 - 4;
    const tone = KIND_TONE(kindOf(sp));
    const isSel = curSpan === sp.id;

    add("rect", { class: "row", x: 0, y: y - 3, width: W, height: ROW - 2, rx: 3, fill: isSel ? C.rowSel : "none" });

    if (sp.depth > 0) {
      add("line", { x1: 8 + (sp.depth - 1) * 16, y1: cy, x2: 15 + (sp.depth - 1) * 16, y2: cy, stroke: C.connector, "stroke-width": 1 });
      add("line", { x1: 15 + (sp.depth - 1) * 16, y1: cy, x2: 15 + (sp.depth - 1) * 16, y2: y + ROW / 2 + 7, stroke: C.connector, "stroke-width": 1 });
    }
    add("text", { class: "lbl", x: 18 + sp.depth * 16, y: cy + 5 }, fitLabel(sp.label, COL - 18 - sp.depth * 16 - (sp.delegated ? 46 : 4)));
    if (sp.delegated) {
      const lw = 18 + sp.depth * 16 + textW(fitLabel(sp.label, COL - 18 - sp.depth * 16 - 46)) + 7;
      add("text", { x: lw, y: cy + 5, class: "own", fill: C.tone.model }, "另一库");
    }

    // 左侧色条：标出这条 span 的操作类型
    add("rect", { x: 0, y: y - 1, width: 4, height: ROW - 8, rx: 1, fill: tone, opacity: 0.9 });

    const bx = x(sp.start), bw = Math.max(2, (sp.dur / t.duration) * TW);
    if (sp.error) {
      // 失败：红底 + 斜纹，和正常 span 一眼区分
      add("rect", { x: bx, y: cy - 8, width: bw, height: 16, rx: 2, fill: C.err, opacity: isSel ? 1 : 0.9 });
      add("rect", { x: bx, y: cy - 8, width: bw, height: 16, rx: 2, fill: "url(#errHatch)" });
      add("text", { x: bx + bw + 7, y: cy + 5, fill: C.err }, fmt(sp.dur));
    } else {
      add("rect", { x: bx, y: cy - 8, width: bw, height: 16, rx: 2, fill: tone, opacity: isSel ? 1 : 0.82 });
      add("text", { x: bx + bw + 7, y: cy + 5, fill: C.dur }, fmt(sp.dur));
    }

    const hit = add("rect", {
      class: "hit", x: 0, y: y - 3, width: W, height: ROW - 2, fill: "transparent",
      "data-span": sp.id,
    });
    // 悬停提示。注意 append() 不返回节点，必须先把 text 写好再 append
    const tip = document.createElementNS(NS, "title");
    tip.textContent =
      `${sp.label}\n${sp.type}\n` +
      `kind ${sp.kind || "-"}  ·  起 ${fmt(sp.start)}  持续 ${fmt(sp.dur)}` +
      (sp.error ? `\n失败：${sp.error.msg}` : "") +
      `\n插桩来源：${sp.owner}`;
    hit.append(tip);
  });

  // 事件委托：不用行内 onclick（用 setAttribute 写函数属性会落到全局作用域求值，不可靠）
  svg.addEventListener("click", (ev) => {
    const h = ev.target.closest ? ev.target.closest(".hit") : null;
    if (!h) return;
    const id = h.getAttribute("data-span");
    curSpan = curSpan === id ? null : id;
    renderTraces();
  });

  // 流式标记
  (t.marks || []).forEach((m) => {
    add("line", { x1: x(m.at), y1: PAD_T - 4, x2: x(m.at), y2: H - PAD_B, stroke: C.warn, "stroke-width": 1, "stroke-dasharray": "2 3" });
    add("text", { x: x(m.at) + 4, y: H - PAD_B + 14, fill: C.warn }, m.label);
  });

  return svg;
}
function niceStep(d) {
  if (!(d > 0)) return 1;                  // 时长为 0 或非数时不返回 0，否则循环步进为 0
  const raw = d / 6;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const s = [1, 2, 2.5, 5, 10].map((m) => m * p).find((v) => v >= raw) || p * 10;
  return s > 0 ? s : 1;
}
const fmt = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(ms % 1000 === 0 ? 0 : 2) + " s" : Math.round(ms) + " ms");

/* ---- 详情面板 ---- */
function renderDetail() {
  const t = window.TRACES.find((x) => x.id === curTrace);
  const p = $("#detail");
  if (!p) return;
  p.textContent = "";
  const sp = t.spans.find((x) => x.id === curSpan);
  if (!sp) {
    p.append(el("div", { class: "panel-h" }, [el("div", { class: "t", text: "选中一条 span" })]));
    p.append(el("div", { class: "panel-empty" }, [
      el("div", { text: "点瀑布图里的任意一行。" }),
      el("div", { style: "margin-top:8px;font-size:12px", text: "面板只列字段值，与观测后端一致；规范逐字段说明在 Span 定义页。" }),
    ]));
    return;
  }
  const def = spansByType[sp.type];

  // ---- 头部：只放一眼要看的运行态信息 ----
  p.append(el("div", { class: "panel-h" }, [
    el("div", { class: "t", text: sp.label }),
    el("div", { class: "m" }, [
      el("span", { text: (sp.kind || def && def.kind || "internal") + " · " + fmt(sp.dur) + " · start " + fmt(sp.start) }),
      el("span", { text: sp.type || "—" }),
    ]),
    sp.error ? el("div", { class: "err-line", text: `${sp.error.type}: ${sp.error.msg}` }) : null,
  ]));

  const body = el("div", { class: "panel-b" });

  // ---- 属性表：观测后端的核心，只有键值。字段名一律是规范字段名 ----
  const rows = Object.entries(sp.attrs || {}).map(([k, v]) => [k, String(v)]);
  if (rows.length) {
    const head = el("div", { class: "attr-head" }, [
      el("span", { text: "属性 " + rows.length }),
      el("input", { class: "attr-search", type: "search", placeholder: "过滤字段名或值…", "aria-label": "过滤属性" }),
    ]);
    body.append(head);
    const list = el("div", { class: "attr-list" });
    rows.forEach(([k, v]) => list.append(attrLine(k, v)));
    body.append(list);
    const input = head.querySelector(".attr-search");
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      Array.from(list.children).forEach((n) => {
        const hitQ = !q || n.textContent.toLowerCase().includes(q);
        n.style.display = hitQ ? "" : "none";
      });
    });
  } else {
    body.append(el("div", { class: "panel-empty", text: "这条 span 没有属性。" }));
  }

  // ---- 规范对照与说明：折到下面，不干扰读字段 ----
  const info = el("details", { class: "panel-info" });
  info.append(el("summary", { text: "规范对照与说明" }));
  const inBody = el("div", { class: "info-body" });

  if (def) {
    const emitted = new Set(sp.emitted || Object.keys(sp.attrs || {}));
    const req = def.attrs.filter((a) => a.reqCat === "required");
    const missing = req.filter((a) => !emitted.has(a.key));
    if (missing.length) {
      inBody.append(el("div", { class: "note warn" }, [
        el("span", { class: "lbl", text: "必填字段未发出" }),
        el("div", { html: `<code>${missing.map((a) => esc(a.key)).join("</code> <code>")}</code>` }),
      ]));
    } else {
      inBody.append(el("div", { class: "vs-note" }, [
        el("b", { text: `规范必填字段 ${req.length} 个，本示例都发了。` }),
        el("span", { text: `这条 span 按 ${def.type} 定义（共 ${def.attrs.length} 个字段），逐字段说明在 Span 定义页。` }),
      ]));
    }
  }

  const rel = relatedMetrics(sp.type);
  if (rel.length) {
    const g = el("div", { class: "grp" });
    g.append(el("div", { class: "grp-h" }, [el("b", { text: "对应指标" }), el("span", { class: "c", text: "点开看定义" })]));
    rel.forEach((n) => {
      const it = el("div", { class: "sp-item" }, [
        el("span", { class: "nm", text: n }),
        el("span", { class: "ct", text: metricByName[n] ? metricByName[n].instrument : "" }),
      ]);
      it.addEventListener("click", () => { goTab("metrics"); selectMetric(n); });
      g.append(it);
    });
    inBody.append(g);
  }

  info.append(inBody);
  body.append(info);
  p.append(body);
}

// 一行属性：值过长时截断，悬停看全文（与观测后端一致）
function attrLine(k, v) {
  const full = String(v);
  const long = full.length > 90;
  const row = el("div", { class: "aline" });
  row.append(el("span", { class: "ak", text: k, title: k }));
  row.append(el("span", { class: "av" + (long ? " trunc" : ""), text: long ? full.slice(0, 88) + "…" : full, title: full }));
  return row;
}

// operation.name 这类全局枚举：先给「本 span 取值」，再说明其余取值属于别的 span。
// 直接把 18 个取值铺在每个 span 上，会让人以为推理 span 上能写 search_memory。
const SCOPE_NOTE = { required: "规范要求", example: "规范给的是示例值",
                     restricted: "规范限定：仅在描述工具调用时，否则不应设置本属性" };
function valueNodes(a, who, opts) {
  const out = [];
  const self = who || "本 span";
  const compact = !!(opts && opts.compact);   // 链路页只列字段值，不铺枚举说明
  if (a.valuesApplicable && a.values && a.valuesApplicable.length < a.values.length) {
    out.push(el("div", {
      class: "vals scope",
      text: self + "取值（" + (SCOPE_NOTE[a.valuesScopeKind] || "本 span 适用") + "） " + a.valuesApplicable.join(" | "),
    }));
    out.push(el("div", {
      class: "vals",
      text: (a.valuesScopeKind === "restricted"
        ? "该属性是全局枚举（" + a.values.length + " 值），本 span 上不应出现其余取值："
        : "该属性是全局枚举（" + a.values.length + " 值），其余取值由别的操作使用：")
        + a.values.filter((v) => a.valuesApplicable.indexOf(v) < 0).join(" | "),
    }));
  } else if (a.values) {
    out.push(el("div", { class: "vals", text: "取值范围 " + a.values.join(" | ") }));
  }
  // 枚举每个取值的说明：只铺值名会丢掉「failed 与 cancelled 差在哪」这类解释。
  // 取值多时折叠起来，避免把面板撑得过长。
  if (a.valueBriefs && Object.keys(a.valueBriefs).length && !compact) {
    const n = a.values ? a.values.length : Object.keys(a.valueBriefs).length;
    const rows = (a.values || Object.keys(a.valueBriefs)).map((v) => {
      const en = a.valueBriefs[v];
      if (!en) return null;
      const zh = (a.valueBriefsZh || {})[v] || en;
      const line = el("div", { style: "display:flex;gap:8px;font-size:11.5px;line-height:1.6" });
      line.append(el("code", { style: "color:var(--fg);flex:0 0 auto", text: v }));
      line.append(el("span", { style: "color:var(--fg-3)", title: en, html: mdInline(zh) }));
      return line;
    }).filter(Boolean);
    if (rows.length && n > 6) {
      const det = el("details", { class: "vals" });
      det.append(el("summary", { style: "cursor:pointer", text: "取值范围说明（" + rows.length + " 条）" }));
      rows.forEach((r) => det.append(r));
      out.push(det);
    } else {
      rows.forEach((r) => out.push(r));
    }
  }
  // 示例值：规范在 registry / 组里都给了 examples，属性表里也有这一列
  if (a.examples && a.examples.length && !compact) {
    out.push(el("div", { class: "vals", text: "示例 " + a.examples.join(" · ") }));
  }
  return out;
}

function attrRow(a, val, has) {
  const row = el("div", { class: "at" });
  row.append(el("div", { class: "at-top" }, [
    el("span", { class: "mark " + (has ? "y" : "n"), text: has ? "✓" : "·" }),
    el("span", { class: "k", text: a.key }),
    el("span", { class: "ty", text: a.type + (a.values ? " : " + a.values.length + " 值" : "") }),
  ]));
  valueNodes(a, null, { compact: true }).forEach((n) => row.append(n));
  if (val !== undefined) {
    row.append(el("div", { class: "val", text: String(val) }));
  } else if (has) {
    row.append(el("div", { class: "no", text: "（示例未展示具体值）" }));
  } else if (a.reqCat === "inherit") {
    row.append(el("div", { class: "no", text: "无必填要求：引用核心语义约定，本仓库不重复规定。" }));
  } else {
    row.append(el("div", { class: "no", text: "参考实现未发出。" }));
  }
  const why = a.why || a.brief;
  if (why) row.append(el("div", { class: "why", text: why }));
  return row;
}

/* span type -> 相关指标 */
const METRIC_REL = {
  "gen_ai.inference.client": ["gen_ai.client.operation.duration", "gen_ai.client.operation.time_to_first_chunk", "gen_ai.client.operation.time_per_output_chunk", "gen_ai.client.inference.usage.input_tokens", "gen_ai.client.inference.usage.output_tokens", "gen_ai.client.inference.usage.cache_read.input_tokens", "gen_ai.client.inference.usage.cache_write.input_tokens", "gen_ai.client.inference.usage.reasoning.output_tokens"],
  "gen_ai.embeddings.client": ["gen_ai.client.operation.duration"],
  "gen_ai.retrieval.client": ["gen_ai.client.operation.duration"],
  "gen_ai.memory.client": ["gen_ai.client.operation.duration"],
  "gen_ai.invoke_workflow.internal": ["gen_ai.invoke_workflow.duration"],
  "gen_ai.invoke_agent.internal": ["gen_ai.invoke_agent.duration", "gen_ai.invoke_agent.inference_calls", "gen_ai.invoke_agent.tool_calls"],
  "gen_ai.execute_tool.internal": ["gen_ai.execute_tool.duration"],
};
const relatedMetrics = (type) => {
  // provider 特化（如 openai.inference.client）要追溯回它扩展的基础 span，
  // 否则点开 OpenAI 的推理 span 会看不到任何关联指标。
  const base = (spansByType[type] && spansByType[type].refines) || type;
  return (METRIC_REL[base] || []).filter((n) => metricByName[n]);
};

/* ============================ Tab3 Span 定义 ============================ */
let curSpanType = SPEC.spans[0].type;
function selectSpan(type) {
  curSpanType = type;
  $$("#span-list .it").forEach((x) => x.classList.toggle("on", x.dataset.type === type));
  renderSpanDetail();
}
function renderSpans() {
  const s = $("#tab-spans");
  s.textContent = "";
  const list = el("div", { class: "slist", id: "span-list" });
  list.append(el("div", { class: "sh", text: "按规范文档" }));
  GROUP_ORDER.forEach((layer) => {
    const items = SPEC.spans.filter((x) => x.group === layer);
    if (!items.length) return;
    list.append(el("div", { class: "sh doc", style: `color:${C.groups[layer]};background:var(--panel)` }, [
      el("i", { style: `display:inline-block;width:7px;height:7px;border-radius:50%;background:${C.groups[layer]};margin-right:7px` }),
      document.createTextNode(layer),
      el("span", { style: "color:var(--fg-3);font-weight:400;margin-left:6px", text: (items[0].groupFile || "") }),
    ]));
    items.forEach((x) => {
      const it = el("div", { class: "it" + (x.type === curSpanType ? " on" : ""), "data-type": x.type });
      it.append(el("span", { class: "nm", text: x.type.replace(/^gen_ai\./, ""), title: x.type }));
      // 特化不是一种 span kind（它继承基础 span 的 kind），标签写清楚，别和 client/internal 混在一个维度
      const kindTxt = x.kind === "refinement" ? "特化 · kind 继承 " + (x.baseKind || "基础 span") : x.kind;
      it.append(el("div", { class: "mt", text: "类型 " + kindTxt + " · " + x.attrs.length + " 字段 · 稳定度 " + x.stability }));
      it.addEventListener("click", () => selectSpan(x.type));
      list.append(it);
    });
  });
  // 补充组：真实链路常见、但规范没有定义的操作。不是规范 span 类型，页面单独说明。
  const gaps = SPEC.gaps || [];
  if (gaps.length) {
    list.append(el("div", { class: "sh", style: "color:var(--fg-3);background:var(--panel)" }, [
      el("i", { style: "display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg-3);margin-right:7px" }),

function metricGlyph(instrument, unit) {

  svg.setAttribute("viewBox", "0 0 22 22");

/* ---- 指标形态图：histogram 看分桶形状，counter 看累加台阶 ---- */
const SHAPES = window.METRIC_SHAPES || {};
function metricShapeSVG(name, unit) {
  const sh = SHAPES[name];
  if (!sh) return null;
  const NS = "http://www.w3.org/2000/svg";
  const W = 560, H = 118, ML = 8, MR = 8, MT = 26, MB = 26;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "mshape");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  const add = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    svg.append(n);
    return n;
  };
  const isTok = unit.includes("token");
  const color = name.startsWith("mcp.") ? C.tone.mcp
    : name.startsWith("openai.") || name.startsWith("aws.bedrock.") ? C.tone.prov
    : isTok ? C.tone.agent : C.tone.model;
  // 秒级刻度：超过 60s 换成 min/h，否则 1800s / 7200s 这种标签读不出来
  const secLabel = (v) => {
    if (!unit.includes("s") || v < 60) return v + (unit === "s" ? "s" : "");
    if (v < 3600) return (v / 60) + "min";
    return (v / 3600) + "h";
  };

  if (sh.kind === "histogram") {
    const data = sh.buckets;
    const maxC = Math.max(...data.map((d) => d.count));
    const bw = (W - ML - MR) / data.length;
    // 基线
    add("line", { x1: ML, y1: H - MB, x2: W - MR, y2: H - MB, stroke: C.grid, "stroke-width": 1 });
    data.forEach((d, i) => {
      const h = Math.max(2, (d.count / maxC) * (H - MT - MB));
      const x = ML + i * bw + 2;
      add("rect", { x, y: H - MB - h, width: bw - 4, height: h, rx: 1.5, fill: color, opacity: 0.55 + 0.45 * (d.count / maxC) });
      add("text", { x: x + (bw - 4) / 2, y: H - MB + 13, "text-anchor": "middle", class: "mshape-x" },
        secLabel(d.upper));
    });
    // 长尾提示：最后两桶加起来占比很小，但正是 P99 的来源
    const total = data.reduce((a, d) => a + d.count, 0);
    const tail = data.slice(-3).reduce((a, d) => a + d.count, 0);
    add("text", { x: ML, y: 14, class: "mshape-t" },
      `共 ${total.toLocaleString()} 次采样　·　最大一桶 ${maxC.toLocaleString()} 次`);
    add("text", { x: W - MR, y: 14, "text-anchor": "end", class: "mshape-t", fill: color },
      `尾部 3 桶占 ${(tail / total * 100).toFixed(1)}%`);
  } else {
    const data = sh.series;
    const maxV = Math.max(...data);
    const stepX = (W - ML - MR) / (data.length - 1);
    const y = (v) => H - MB - (v / maxV) * (H - MT - MB);
    add("line", { x1: ML, y1: H - MB, x2: W - MR, y2: H - MB, stroke: C.grid, "stroke-width": 1 });
    // 累加计数器的真实形态是阶梯，不是平滑曲线
    for (let i = 0; i < data.length - 1; i++) {
      const x1 = ML + i * stepX, x2 = ML + (i + 1) * stepX;
      add("line", { x1, y1: y(data[i]), x2, y2: y(data[i]), stroke: color, "stroke-width": 2 });
      add("line", { x1: x2, y1: y(data[i]), x2, y2: y(data[i + 1]), stroke: color, "stroke-width": 2 });
    }
    add("line", { x1: ML + (data.length - 1) * stepX, y1: y(data[data.length - 1]),
      x2: W - MR, y2: y(data[data.length - 1]), stroke: color, "stroke-width": 2 });
    // 台阶数：缓存类指标的台阶最明显
    const flats = data.filter((v, i) => i > 0 && v === data[i - 1]).length;
    add("text", { x: ML, y: 14, class: "mshape-t" },
      `累计到 ${maxV.toLocaleString()}　·　${data.length} 个采样点`);
    add("text", { x: W - MR, y: 14, "text-anchor": "end", class: "mshape-t", fill: color },
      flats ? `${flats} 段持平（没消耗）` : "持续增长");
  }
  return svg;
}

function metricBlock(m, focused) {
  const row = el("div", { class: "mrow", "data-name": m.name });
  row.append(metricGlyph(m.instrument, m.unit));
  const mid = el("div");
  mid.append(el("div", { class: "nm", text: m.name }));
  if (m.brief) mid.append(el("div", { class: "bd", text: m.brief }));
  const why = METRIC_WHY[m.name] || TOKEN_WHY[m.name] || MCP_WHY[m.name];
  if (why) mid.append(el("div", { class: "nt", text: why }));
  if (m.note) mid.append(el("div", { class: "nt", text: m.note }));
  const by = METRIC_EMITTED_BY[m.name];
  if (by) mid.append(el("div", { class: "nt", text: "参考实现里发过这个指标的库：" + by }));
  // 形态图：让读者看懂这个指标量的是「什么形状的数」，而不只是看定义
  const sh = SHAPES[m.name];
  if (sh) {
    mid.append(el("div", { class: "mfig" }, [metricShapeSVG(m.name, m.unit)]));
    mid.append(el("div", { class: "mfig-note" }, [
      el("span", { class: "tag", text: sh.kind === "histogram" ? "分布形态" : "累加形态" }),
      el("span", { html: " " + esc(sh.note) }),
    ]));
  }
  row.append(mid);
  row.append(el("div", {}, [
    el("span", { class: "rq " + m.reqCat, text: m.reqCat === "inherit" ? "—" : REQ_LABEL[m.reqCat] }),
  ]));
  row.append(el("div", { class: "u" }, [
    el("div", { text: m.instrument }),
    el("div", { text: "unit " + m.unit, style: "color:var(--fg-3);margin-top:2px" }),
    el("div", { text: m.file.replace(".yaml", ""), style: "color:var(--fg-3);margin-top:2px;font-size:11px" }),
  ]));
  // 点击行只需选中，不必全量重建——重建会把高亮和聚焦块一起清掉
  row.addEventListener("click", () => selectMetric(m.name));
  return row;
}

/* ============================ Tab5 事件 ============================ */
function renderEvents() {
  const s = $("#tab-events");
  s.textContent = "";
  s.append(el("div", { class: "note", style: "margin-bottom:16px" }, [
    el("span", { class: "lbl", text: "事件与 span 的取舍" }),
    el("div", {
      html: "事件是独立上报的信号。第一个事件 <code>gen_ai.client.inference.operation.details</code> 整组复用了 inference span 的字段集——" +
        "同样的内容可以挂在 span 属性上，也可以发成事件。区别在采样：<strong>span 被采样丢弃时属性一起没了，而事件可以独立保留。</strong>" +
        "所以内容类字段（完整输入输出消息）倾向走事件，成本与诊断价值由采集方自己权衡。",
    }),
  ]));
  SPEC.events.forEach((e) => {
    const card = el("div", { class: "card", style: "margin-top:16px" });
    card.append(el("div", { class: "card-h" }, [
      el("h3", { text: e.name }),
      el("span", { class: "tag", text: e.fields.length + " 字段" }),
      el("span", { class: "tag", text: "stability " + e.stability }),
    ]));
    const b = el("div", { class: "card-b" });
    b.append(el("div", { class: "brief", style: "color:var(--fg-2);font-size:13px", text: e.brief }));
    if (e.viaSpan) {
      b.append(el("div", { class: "note warn", style: "margin-top:12px" }, [
        el("span", { class: "lbl", text: "字段来源" }),
        el("div", {
          html: `它的字段<strong>整组引用</strong>了 <code>${esc(e.viaSpan)}</code> 的字段表（定义写法是 <code>ref_group: span.${esc(e.viaSpan)}</code>），` +
            `所以两边字段完全一致。点下方任一字段可跳到 Span 定义页看完整语境。`,
        }),
      ]));
    }
    const tbl = el("table", { style: "margin-top:0" });
    tbl.append(el("thead", {}, [el("tr", {}, [
      el("th", { text: "字段" }), el("th", { text: "类型" }), el("th", { text: "必填程度" }), el("th", { text: "说明" }),
    ])]));
    const tb = el("tbody");
    REQ_ORDER.forEach((cat) => {
      const items = e.fields.filter((f) => f.reqCat === cat);
      items.forEach((f) => {
        const tr = el("tr");
        tr.append(el("td", {}, [el("span", { class: "k", text: f.key })]));
        tr.append(el("td", {}, [el("span", { class: "ty", text: f.type })]));
        tr.append(el("td", {}, [el("span", { class: "rq " + f.reqCat, text: cat === "inherit" ? "—" : REQ_LABEL[cat] })]));
        const d = el("td");
        d.append(el("div", { class: "desc", text: f.why || f.brief }));
        valueNodes(f, "本事件").forEach((n) => d.append(n));
        tr.append(d);
        tb.append(tr);
      });
    });
    tbl.append(tb);
    b.append(el("div", { class: "tbl-scroll" }, [tbl]));
    card.append(b);
    s.append(card);
  });
}

/* ============================ 主题 ============================ */
function applyTheme(name) {
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("genai-spec-theme", name); } catch (e) { /* 隐私模式下忽略 */ }
  const b = $("#theme-btn");
  if (b) b.textContent = name === "dark" ? "浅色" : "深色";
  loadThemeColors();                 // 颜色从 CSS 变量重取
  renderOverview(); renderTraces(); renderSpans(); renderMetrics(); renderEvents();
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("genai-spec-theme"); } catch (e) { /* ignore */ }
  if (!saved) saved = "light";       // 默认给浅色：深色长时间读密集表格较吃力
  applyTheme(saved);
}

/* ============================ 启动 ============================ */
function renderMeta() {
  const src = SPEC.source;
  $("#meta").innerHTML =
    `<b>${esc(src.repo)}</b><br>commit ${esc(src.commit.slice(0, 9))}<br>${esc(src.schemaUrl)}<br>stability: development`;
  // 数字全部从 SPEC 现算，不写死——写死过一次，加了 MCP 与 provider 特化之后
  // 页脚还写着「11 个 span / 18 个指标」，和上面的 Tab 徽标互相打脸。
  const capN = window.TRACES.filter((t) => t.captured).length;
  const synthN = window.TRACES.length - capN;
  $("#foot").innerHTML =
    `字段定义全部由 <code>model/</code> 下的 YAML 抽取生成（${SPEC.spans.length} 个 span、${SPEC.metrics.length} 个指标、` +
    `${SPEC.events.length} 个事件、${SPEC.registry.total} 个属性（本地 model/ 定义）），未改写任何口径；` +
    `span 表实际引用 ${[...new Set(SPEC.spans.flatMap((x) => x.attrs.map((a) => a.key)))].length} 个属性，` +
    `差额来自核心约定依赖（error.type、server.*、network.* 等）。<br>` +
    `Trace 示例共 ${window.TRACES.length} 条，都是规范形态：字段名、span 类型、层级归属全部按规范写。` +
    `其中 ${capN} 条由 o11y 抓到的 xiaoai-claw 生产链路改写（时序、token 数、轮次是实测值），` +
    `${synthN} 条按 <code>reference/scenarios/</code> 的场景形态构造（数值为示意）。<br>` +
    `改写规则在 <code>real_to_spec.py</code>，逐条人工核过；原始数据留在 <code>traces-raw.json</code>，不进页面。<br>` +
    `规范本体：<a href="https://github.com/open-telemetry/semantic-conventions-genai">open-telemetry/semantic-conventions-genai</a>　` +
    `生成脚本：<code>extract.py</code>`;
}
buildTabs();
renderMeta();
initTheme();                         // 内部会调用各 render
$("#theme-btn").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "t" && !e.metaKey && !e.ctrlKey && !e.altKey
      && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  }
});
</script>
